function visiblePayments(){
  var f = payFilter, q = normText(f.q).join(' ');
  var conn = f.k === 'all' ? null : (BANK.conns || []).filter(function(c){ return c.id === f.k; })[0];
  var keys = conn ? (conn.accounts || []).map(function(a){ return a.k; }) : null;
  return classified().filter(function(c){
    if (f.m !== null && !(monthIndexOf(c.t.d) === f.m && (f.m > 0 || c.t.d >= PLAN.asOf))) return false;
    if (f.b !== 'all' && c.b !== f.b) return false;
    if (keys && keys.indexOf(c.t.k) === -1) return false;
    if (q && normText(c.t.who + ' ' + (c.t.desc || '')).join(' ').indexOf(q) === -1) return false;
    return true;
  });
}

function paymentRowsHtml(){
  if (!hasBank()) return '';
  var all = visiblePayments();
  var shown = all.filter(function(c){ return payFilter.hidden || !c.hidden; });
  var hidden = all.length - all.filter(function(c){ return !c.hidden; }).length;
  $('p-count').textContent = shown.length + (shown.length === 1 ? ' payment' : ' payments');
  if (!shown.length) return '<p class="deck" style="padding:18px 0">' + (all.length ? 'Only hidden payments here.' : 'Nothing here.') + '</p>' + hiddenLine(hidden);
  var html = '', day = null, total = 0;
  shown.forEach(function(c){ if (c.counts) total += c.out; });
  if (payFilter.b !== 'all' && payFilter.b !== 'in') html += '<p class="small" style="padding-top:12px">' + esc(fmt(total, true)) + ' counted in these</p>';
  shown.slice(0, 400).forEach(function(c){
    if (c.t.d !== day){ day = c.t.d; html += '<p class="eyebrow dayhead">' + esc(dayLabel(day)) + '</p>'; }
    html += paymentRowHtml(c);
  });
  if (shown.length > 400) html += '<p class="small" style="padding:12px 0">The newest 400 shown. Search or filter to find older ones.</p>';
  return html + hiddenLine(hidden);
}
function hiddenLine(n){
  if (!n) return '';
  return '<button class="link" data-act="toggle-hidden"><span>' + (payFilter.hidden ? 'Hide the hidden again' : n + ' hidden') + '</span>' +
    '<span class="n">' + (payFilter.hidden ? '' : 'show ›') + '</span></button>';
}
/* Who did what, for the other person to see: "moved by Ada", "flagged by Ada". */
function byOther(x){ return x && x.by && x.by !== ME ? x.by : null; }
function paymentSub(c){
  var bits = [c.own ? 'Between your accounts' : c.b === 'in' ? 'Money in' : bucketLabel(c.b)];
  var acct = accountOf(c.t.k);
  if (acct && BANK.conns.length > 1) bits.push(bankShort(acct.bank));
  if (!c.own && c.tag.ns) bits.push('not spending');
  if (c.hidden) bits.push('hidden');
  if (c.src === 'tag' && byOther(c.tag)) bits.push('moved by ' + c.tag.by);
  else if (c.src === 'payee' && byOther(c.rule)) bits.push('always, set by ' + c.rule.by);
  return bits.join(' · ');
}
function paymentRowHtml(c){
  var t = c.t, credit = t.amt > 0;
  return '<button class="row' + (c.counts ? '' : ' ns') + (c.hidden ? ' off' : '') + '" data-pay="' + esc(t.id) + '">' +
    '<span class="grow"><span class="who">' + (isNew(c) ? '<span class="newdot" aria-label="new"></span>' : '') +
      '<b>' + esc(t.who || t.desc || 'Payment') + '</b></span>' +
      '<span class="sub">' + esc(paymentSub(c)) + '</span></span>' +
    (c.flag ? '<span class="chip q">' + (byOther(c.tag) ? 'flagged by ' + esc(c.tag.by) : 'flagged') + '</span>' : '') +
    '<span class="amt' + (credit ? ' good' : '') + '">' + (credit ? '+' : '') + esc(fmtAmt(Math.abs(t.amt))) + '</span></button>';
}

function spendRowsHtml(e){
  var list = newestFirst(e.entries);
  if (!list.length) return '<p class="deck" style="padding:12px 0">Nothing entered this month yet.</p>';
  return list.map(function(s){
    var bits = s.note ? [dayLabel(s.d), flexLabel(s.cat)] : [dayLabel(s.d)];
    if (s.by && s.by !== ME) bits.push(s.by);
    if (s.pending) bits.push(sending && !sendFailed ? 'saving…' : 'not sent yet');
    return '<div class="row"><span class="grow"><b>' + esc(s.note || flexLabel(s.cat)) + '</b>' +
      '<span class="sub">' + esc(bits.join(' · ')) + '</span></span>' +
      '<span class="amt' + (isIn(s) ? ' good' : '') + '">' + (isIn(s) ? '+' : '') + fmtAmt(s.amt) + '</span>' +
      '<button class="del" data-del="' + esc(s.id) + '" aria-label="Delete ' + esc(fmtAmt(s.amt) + ' ' + (s.note || flexLabel(s.cat))) + '">×</button></div>';
  }).join('');
}

function renderUndo(){
  var box = $('undo');
  if (!undoItem && undoTag){
    box.innerHTML = '<div class="float"><span class="undo-msg">' + esc(undoTag.msg) + '</span>' +
      '<button class="undo" data-act="undo-tag">Undo</button></div>';
    return;
  }
  if (!undoItem){ box.innerHTML = ''; return; }
  box.innerHTML = '<div class="float"><span class="undo-msg">Deleted ' + esc(fmtAmt(undoItem.amt)) + ' ' +
    esc(undoItem.note || flexLabel(undoItem.cat).toLowerCase()) + '</span>' +
    '<button class="undo" data-act="undo">Undo</button></div>';
}

function renderFloat(cur, base){
  var box = $('float');
  if (page !== 'subs' || cur.subsT === base.subsT){ box.innerHTML = ''; return; }
  var lastLabel = PLAN.months[PLAN.months.length-1].label;
  box.innerHTML = '<div class="float"><div><div class="l1">By ' + esc(lastLabel) + '</div>' +
    '<div class="l2"><span class="was">' + fmt(base.end) + '</span><span class="arrow">→</span>' +
    '<span class="now">' + fmt(cur.end) + '</span></div></div>' +
    '<button data-back="subs">Done</button></div>';
}

/* ─────────────────────────── events ─────────────────────────── */

document.addEventListener('click', function(e){
  var bk = e.target.closest('[data-pin],[data-pinkey],[data-pay],[data-move],[data-scope],[data-pays],[data-bf],[data-kf],[data-connect],[data-disconnect]');
  if (bk){
    e.preventDefault();
    var d = bk.dataset;
    if (d.pinkey) return pinKey(d.pinkey);
    if (d.pin) return openPin(d.pin, d.pin === 'set' ? function(){ go('bank', true); } : null);
    if (d.pay) return openPayment(d.pay);
    if (d.move){ payDraft.b = d.move; return renderSheet(); }
    if (d.scope) return movePayment(d.scope);
    if (d.pays){
      payFilter.b = d.pays; payFilter.q = ''; payFilter.hidden = false;
      var from = page;
      go('payments', true);
      payFilter.m = d.month !== undefined ? Number(d.month) : (from === 'today' && d.pays !== 'all' ? monthIndexOf(todayStr()) : null);
      return render();
    }
    if (d.bf){ payFilter.b = d.bf; return render(); }
    if (d.kf){ payFilter.k = d.kf; return render(); }
    if (d.connect) return connectBank(d.connect, d.country);
    if (d.disconnect) return disconnectBank(d.disconnect);
    return;
  }
  var b = e.target.closest('[data-go],[data-sheet],[data-back],[data-open],[data-act],[data-cat],[data-day],[data-del],[data-key],[data-dir]');
  if (!b) return;
  if (b.dataset.act === 'pin-go'){ e.preventDefault(); return pinSubmit(); }
  if (b.dataset.act === 'undo-tag'){ e.preventDefault(); var u = undoTag; if (u) tagWrite(u.bodies, '', true); return; }
  if (b.dataset.act === 'sync'){ e.preventDefault(); return syncNow(); }
  if (b.dataset.act === 'forget'){ e.preventDefault(); return forgetPhone(); }
  if (b.dataset.act === 'bank-list'){ e.preventDefault(); return loadBanks(); }
  if (b.dataset.act === 'toggle-hidden'){ e.preventDefault(); payFilter.hidden = !payFilter.hidden; return render(); }
  if (b.dataset.act === 'all-months'){ e.preventDefault(); payFilter.m = null; return render(); }
  if (b.dataset.key){ e.preventDefault(); return padKey(b.dataset.key); }
  if (b.dataset.dir){
    /* Spent and Received are different forms; redraw it and keep what was typed. */
    e.preventDefault();
    var typed = $('lg-amt').value, memo = $('lg-note').value;
    logDraft.dir = b.dataset.dir;
    renderSheet();
    $('lg-amt').value = typed; $('lg-note').value = memo;
    $('lg-amt').focus();
    return updateLogHint();
  }
  if (b.dataset.cat || b.dataset.day){
    e.preventDefault();
    var k = b.dataset.cat ? 'cat' : 'day';
    logDraft[k] = b.dataset[k];
    b.parentNode.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', String(x === b)); });
    if (k === 'day' && $('lg-date')) $('lg-date').textContent = shortDate(logDate(logDraft.day));
    return updateLogHint();
  }
  if (b.dataset.del){ e.preventDefault(); return deleteSpend(b.dataset.del); }
  if (b.dataset.act === 'save-spend'){ e.preventDefault(); return saveSpend(); }
  if (b.dataset.act === 'cancel'){ e.preventDefault(); return closeSheet(); }
  if (b.dataset.act === 'undo'){ e.preventDefault(); return undoDelete(); }
  if (b.dataset.act === 'keep'){ e.preventDefault(); return keepSheet(); }
  if (b.dataset.act === 'reset'){ e.preventDefault(); closeSheet(); return resetAll(); }
  if (b.dataset.open === 'subs'){ e.preventDefault(); keepSheet(); return go('subs', true); }
  if (b.dataset.back === 'subs'){ e.preventDefault(); return go(cameFrom, true); }
  if (b.dataset.sheet){ e.preventDefault(); return openSheet(b.dataset.sheet); }
  if (b.dataset.go){ e.preventDefault(); return go(b.dataset.go, true); }
});

/* The number pad writes into the amount field: at most two decimals and seven
   digits, one decimal point, the currency sign shown in front. */
function padKey(k){
  var el = $('lg-amt');
  if (!el) return;
  var raw = el.value.replace(/[^\d.,]/g, '').replace(',', '.');
  if (k === 'del') raw = raw.slice(0, -1);
  else if (k === '.'){ if (raw.indexOf('.') === -1) raw = (raw || '0') + '.'; }
  else {
    var dot = raw.indexOf('.');
    if (dot > -1 && raw.length - dot > 2) return;
    if (raw.replace('.', '').length >= 7) return;
    raw = (raw === '0' ? '' : raw) + k;
  }
  el.value = raw ? CUR + raw : '';
  updateLogHint();
}

function updateLogHint(){
  var h = $('lg-hint');
  if (h) h.textContent = logHint(cents(parseAmount($('lg-amt').value)));
  var err = $('lg-err');
  if (err) err.textContent = '';
}
/* On the whole document: a tap on the pad redraws the sheet, and focus falls back
   to the page, so a listener on the sheet alone would miss the next key. */
document.addEventListener('keydown', function(e){
  if (sheetKind !== 'pin' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^\d$/.test(e.key)){ e.preventDefault(); return pinKey(e.key); }
  if (e.key === 'Backspace'){ e.preventDefault(); return pinKey('del'); }
  if (e.key === 'Enter'){ e.preventDefault(); return pinSubmit(); }
});
$('sheet').addEventListener('keydown', function(e){
  if (sheetKind === 'log' && e.key === 'Enter' && (e.target.id === 'lg-amt' || e.target.id === 'lg-note')){
    e.preventDefault();
    saveSpend();
  }
});
$('sheet').addEventListener('input', function(e){
  var el = e.target;
  if (el.id === 'lg-amt') return updateLogHint();
  if (el.type !== 'range') return;
  draft[el.dataset.k] = Number(el.value);
  el.style.setProperty('--p', ((el.value - el.min) / (el.max - el.min) * 100) + '%');
  var o = $('o-' + el.dataset.k);
  if (o) o.textContent = fmt(Number(el.value));
  var r = $('sheet-result');
  if (r) r.innerHTML = resultRows(draft);
});
$('sheet').addEventListener('change', function(e){
  if (e.target.id !== 'gem-sel') return;
  draft.gem = e.target.value;
  var r = $('sheet-result');
  if (r) r.innerHTML = resultRows(draft);
});
$('scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && sheetKind) closeSheet(); });

document.addEventListener('input', function(e){
  var el = e.target;
  if (el.id === 'pay-q'){ payFilter.q = el.value; $('p-rows').innerHTML = paymentRowsHtml(); }
  if (el.id === 'bank-q'){
    bankQuery = el.value;
    var q = normText(bankQuery).join(' ');
    var box = $('bank-rows');
    if (box && Array.isArray(BANKS_LIST)) box.innerHTML = bankRowsHtml(BANKS_LIST.filter(function(b){
      return !q || normText(b.name).join(' ').indexOf(q) > -1;
    }));
  }
});

document.addEventListener('change', function(e){
  var el = e.target;
  if (el.dataset && el.dataset.tog){
    var c = classified().filter(function(x){ return x.t.id === payDraft.id; })[0];
    if (!c) return;
    var body = { id: c.t.id }; body[el.dataset.tog] = el.checked;
    var words = { ns: ['Not spending', 'Counts as spending again'], hide: ['Hidden', 'Counted again'], flag: ['Flagged', 'Flag removed'] }[el.dataset.tog];
    return tagWrite([body], (c.t.who || 'Payment') + ': ' + (el.checked ? words[0] : words[1]).toLowerCase());
  }
  if (el.id === 'bank-country'){ bankCountry = el.value; bankQuery = ''; return loadBanks(); }
  if (el.dataset && el.dataset.task){
    if (el.checked) S.tasks[el.dataset.task] = true; else delete S.tasks[el.dataset.task];
    push(); render(); return;
  }
  if (el.classList.contains('sw')){
    var on = (S.subs||[]).slice();
    if (el.checked){ if (on.indexOf(el.value) === -1) on.push(el.value); }
    else on = on.filter(function(x){ return x !== el.value; });
    S.subs = on.sort();
    push(); render();
  }
});

window.addEventListener('popstate', function(){ go(location.hash.slice(1), false); });
window.addEventListener('resize', function(){ if (PLAN) render(); });
document.addEventListener('visibilitychange', function(){ if (!document.hidden) poll(); });

/* ─────────────────────────── start ─────────────────────────── */

function showBoot(msg){
  $('boot').hidden = false;
  $('app').hidden = true;
  $('tabs').hidden = true;
  if (msg) $('boot-msg').textContent = msg;
  $('boot-code').value = CODE || '';
}
$('boot-go').addEventListener('click', function(){
  var c = normCode($('boot-code').value);
  if (!c) return;
  store.set('runway-code', c);
  location.search = '?c=' + c;
});
$('boot-code').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('boot-go').click(); });

async function start(){
  if (!CODE) return showBoot();
  store.set('runway-code', CODE);
  var ob = store.get(outboxKey());
  OUTBOX = Array.isArray(ob) ? ob : [];
  bankKey = store.get(bankKeyName()) || null;
  SEEN = store.get(seenName()) || null;
  var bc = bankKey ? store.get(bankCacheName()) : null;
  if (bc && bc.conns) BANK = bc;

  /* Back from the bank's own login page: ?bank=ok|cancel|fail|expired. */
  var back = qs.get('bank');
  if (back){
    bankMsg = {
      ok: 'Connected. The first sync takes a few seconds.',
      cancel: 'Connecting was cancelled at the bank.',
      expired: 'That attempt took too long. Start again.',
      fail: 'The bank did not connect. Try again.'
    }[back] || '';
    var u = new URL(location.href);
    u.searchParams.delete('bank');
    history.replaceState(null, '', u.pathname + u.search + '#bank');
    if (back === 'ok') [3000, 9000].forEach(function(ms){ setTimeout(function(){ pullBank().then(function(ok){ if (ok) render(); }); }, ms); });
  }

  var cached = store.get(cacheKey());
  if (cached && cached.plan){
    applyRemote({ plan:cached.plan, state:cached.state, rev:cached.rev, by:cached.by, updated:cached.updated, spends:cached.spends });
    $('boot').hidden = true; $('app').hidden = false;
    go(location.hash.slice(1) || 'today', false);
  }

  try {
    var data = await pull();
    applyRemote(data);
    $('boot').hidden = true; $('app').hidden = false;
    go(location.hash.slice(1) || 'today', false);
  } catch(err){
    if (!PLAN) return showBoot(String(err.message || err));
  }

  if (OUTBOX.length) flush();
  if (bankKey && (await pullBank())){ BANKREV = BANKINFO.rev; render(); }
  clearInterval(pollTimer);
  pollTimer = setInterval(poll, 8000);
}
start();
})();
</script>
