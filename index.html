<script>
(function(){
"use strict";

/* ─────────────────────────── plumbing ─────────────────────────── */

var $ = function(id){ return document.getElementById(id); };
var qs = new URLSearchParams(location.search);
var API = (qs.get('api') || 'https://runway.paul-o-a04.workers.dev').replace(/\/+$/, '');

var store = {
  get: function(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set: function(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

function normCode(v){ return String(v||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,16); }

var CODE = normCode(qs.get('c') || (location.hash.match(/c=([a-z0-9]+)/i)||[])[1] || store.get('runway-code'));
var ME = String(qs.get('me') || store.get('runway-me') || '').replace(/[^\p{L}\p{N} .'-]/gu,'').trim().slice(0,24);
if (qs.get('me')) store.set('runway-me', ME);

var PLAN = null;      // the figures the owner maintains
var S = null;         // what is on screen now
var BASE = null;      // the plan's own defaults, to compare against
var REMOTE = { rev:0, by:null, updated:null };
var SPENDS = [];      // logged spends as the Worker last returned them
var OUTBOX = [];      // spend writes not yet acknowledged: { op:'put', spend, by } | { op:'del', id }
var sending = false, sendFailed = false, refused = 0;
var page = 'today';
var pushTimer = null, pollTimer = null, dirty = false;

/* ─────────────────────────── format ─────────────────────────── */

var CUR = '€';
function fmt(v, dec){
  var r = dec ? Math.round(v*100)/100 : Math.round(v);
  var s = Math.abs(r).toLocaleString('en-GB', {
    minimumFractionDigits: dec?2:0, maximumFractionDigits: dec?2:0
  });
  return (r < 0 ? '−' : '') + CUR + s;
}
/* Cents only when there are cents: €50, €12.50. */
function fmtAmt(v){ return fmt(v, Math.round(v*100) % 100 !== 0); }
/* What is left, or how far over, never clamped: "€226" or "€40 over". */
function fmtLeft(v){ return v < 0 ? fmtAmt(-v) + ' over' : fmtAmt(v); }
function ago(iso){
  if (!iso) return '';
  var d = (Date.now() - new Date(iso).getTime()) / 1000;
  if (d < 90) return 'just now';
  if (d < 3600) return Math.round(d/60) + 'm ago';
  if (d < 86400) return Math.round(d/3600) + 'h ago';
  return Math.round(d/86400) + 'd ago';
}
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* ─────────────────────────── months and spends ─────────────────────────── */

/* PLAN.months[0] is the calendar month of PLAN.asOf; each next entry is the next
   calendar month. monthIndexOf() and monthBounds() are the only two places that
   know where a month starts and ends. Dates are local calendar days built from
   local getters, never toISOString(), which is UTC and flips the day near midnight. */

function pad2(n){ return (n < 10 ? '0' : '') + n; }
function ymd(dt){ return dt.getFullYear() + '-' + pad2(dt.getMonth() + 1) + '-' + pad2(dt.getDate()); }
function ymdParts(s){ return String(s).split('-').map(Number); }
function todayStr(){ return ymd(new Date()); }
function addDays(s, n){ var p = ymdParts(s); return ymd(new Date(p[0], p[1] - 1, p[2] + n)); }
/* Whole days from a to b (both YYYY-MM-DD); UTC arithmetic so a DST change is not a day. */
function daysFrom(a, b){
  var x = ymdParts(a), y = ymdParts(b);
  return Math.round((Date.UTC(y[0], y[1] - 1, y[2]) - Date.UTC(x[0], x[1] - 1, x[2])) / 864e5);
}

/* The month index a YYYY-MM-DD falls in. Can be below 0 or past the last month;
   callers check the range. */
function monthIndexOf(d){
  var a = ymdParts(PLAN.asOf), b = ymdParts(d);
  return (b[0] - a[0]) * 12 + (b[1] - a[1]);
}
/* First and last calendar day of month index i, as YYYY-MM-DD. */
function monthBounds(i){
  var a = ymdParts(PLAN.asOf);
  return { first: ymd(new Date(a[0], a[1] - 1 + i, 1)), last: ymd(new Date(a[0], a[1] + i, 0)) };
}
function inRange(i){ return i >= 0 && i < PLAN.months.length; }

/* The Worker's list with this phone's unsent writes laid over it, so a poll can
   never take away a spend that has not reached the Worker yet. */
function allSpends(){
  var by = {}, order = [];
  SPENDS.forEach(function(s){ if (!by[s.id]) order.push(s.id); by[s.id] = s; });
  OUTBOX.forEach(function(op){
    if (op.op === 'put'){
      if (!by[op.spend.id]) order.push(op.spend.id);
      by[op.spend.id] = Object.assign({}, op.spend, { by: op.by, pending: true });
    } else {
      delete by[op.id];
    }
  });
  return order.filter(function(id){ return by[id]; }).map(function(id){ return by[id]; });
}

/* Spends counted in month i. Month 0 counts only from PLAN.asOf: the bank figure
   and the September ceiling are both as of that day. */
function spendsIn(i){
  return allSpends().filter(function(s){
    return monthIndexOf(s.d) === i && (i > 0 || s.d >= PLAN.asOf);
  });
}
function newestFirst(list){
  return list.slice().sort(function(a, b){
    if (a.d !== b.d) return a.d < b.d ? 1 : -1;
    return String(b.at || '9') < String(a.at || '9') ? -1 : 1;
  });
}
function cents(v){ return Math.round(v * 100) / 100; }

function isIn(s){ return s.dir === 'in'; }

/* The money for month i and what has gone out of it.
   Month 0 is one envelope, PLAN.septCeiling; later months are the flex budgets
   (st, the state being shown, so a slider moves them). Money in (a repayment, a
   transfer) adds to the month's money: total is the budget plus what came in.
   left may be negative. */
function envelope(i, st){
  st = st || S;
  var all = spendsIn(i), today = todayStr(), b = monthBounds(i);
  var list = all.filter(function(s){ return !isIn(s); });
  var income = cents(all.filter(isIn).reduce(function(t, s){ return t + s.amt; }, 0));
  var cats = PLAN.flex.map(function(f){
    return { id:f.id, label:f.label, budget: i === 0 ? null : (Number(st[f.id]) || 0), spent:0 };
  });
  var byId = {};
  cats.forEach(function(c){ byId[c.id] = c; });
  var logged = 0, other = 0, todaySpent = 0;
  list.forEach(function(s){
    logged += s.amt;
    if (byId[s.cat]) byId[s.cat].spent += s.amt; else other += s.amt;
    if (s.d === today) todaySpent += s.amt;
  });
  /* Everyday payments from the bank count against the same envelope as cash. They
     go into the daily chart as entries of their own, never into the cash list. */
  var bankDays = [], bank = 0, outside = 0, atm = [];
  bankIn(i).forEach(function(c){
    if (!c.counts || c.b !== 'everyday') return;
    if (c.atm){ atm.push(c); return; }
    bank += c.out;
    if (c.pocket && byId[c.pocket]){ byId[c.pocket].spent += c.out; byId[c.pocket].card = (byId[c.pocket].card || 0) + c.out; }
    else outside += c.out;
    bankDays.push({ d: c.t.d, amt: c.out });
    if (c.t.d === today) todaySpent += c.out;
  });
  /* Cash from a machine is spent twice over if it counts here and again when it is
     entered. Entered cash draws on the month's withdrawals first; only cash taken out
     and not entered (yet) counts as spending from the bank. */
  var cashOut = cents(atm.reduce(function(t, c){ return t + c.out; }, 0));
  var unentered = cents(Math.max(0, cashOut - logged));
  if (unentered){
    var last = atm.reduce(function(a, c){ return c.t.d > a.t.d ? c : a; });
    bank += unentered;
    if (last.pocket && byId[last.pocket]){ byId[last.pocket].spent += unentered; byId[last.pocket].card = (byId[last.pocket].card || 0) + unentered; }
    else outside += unentered;
    bankDays.push({ d: last.t.d, amt: unentered });
    if (last.t.d === today) todaySpent += unentered;
  }
  bank = cents(bank);
  /* With a pocket linked, what is left of a budget is simply what the pocket holds. */
  var pockets = 0, pocketLeft = 0;
  cats.forEach(function(c){
    c.spent = cents(c.spent);
    c.left = c.budget === null ? null : cents(c.budget - c.spent);
    var pa = hasBank() ? pocketAcct(c.id) : null;
    if (pa && pa.a.bal !== null && pa.a.bal !== undefined){ c.left = cents(pa.a.bal); c.inPocket = true; pockets++; }
    pocketLeft += c.left || 0;
  });
  /* st.sept is the old single "spent" number; normally 0, still honoured. */
  var legacy = i === 0 ? (Number(st.sept) || 0) : 0;
  var budget = i === 0 ? PLAN.septCeiling : flexTotal(st);
  var total = cents(budget + income);
  var spent = cents(logged + legacy + bank);
  var left = cents(total - spent);
  var from = today > b.first ? today : b.first;
  var daysLeft = today > b.last ? 0 : daysFrom(from, b.last) + 1;
  return {
    index:i, label: PLAN.months[i] ? PLAN.months[i].label : '', first:b.first, last:b.last,
    budget:budget, income:income, total:total, spent:spent, logged:cents(logged), legacy:legacy, other:cents(other),
    bank:bank, outside:cents(outside), pockets:pockets, pocketLeft:cents(pocketLeft), left:left, daysLeft:daysLeft, perDay: left > 0 && daysLeft > 0 ? left / daysLeft : null,
    cashOut:cashOut, unentered:unentered,
    todaySpent:cents(todaySpent), count:all.length, cats:cats, list:list.concat(bankDays), entries:all
  };
}

/* Flex money a month ≥1 costs the forecast beyond its budgets: max(budget, spent)
   per category, so going over moves the forecast and staying under does not. */
function overBudget(i, st){
  var e = envelope(i, st);
  /* Bank payments have no food / going out / misc split, so with a bank the test is
     the whole envelope: cash and card together against the budgets together. */
  if (hasBank()) return cents(Math.max(0, e.logged + e.bank - e.budget));
  return cents(e.cats.reduce(function(t, c){ return t + Math.max(0, c.spent - c.budget); }, 0) + e.other);
}
/* One-offs from the bank: money that left outside every budget, so it moves the forecast. */
function oneOffsIn(i){ return bucketSum(bankIn(i), 'oneoff'); }

/* ─────────────────────────── the model ─────────────────────────── */

function defaults(plan){
  var d = { tasks:{} };
  plan.flex.forEach(function(f){ d[f.id] = f.plan; });
  (plan.extras||[]).forEach(function(e){ d[e.id] = e.plan || 0; });
  d.salary = plan.salary.amount;
  d.gem = plan.gemeente.month;
  d.sept = 0;
  d.subs = plan.subs.filter(function(s){ return !s.cancelled; }).map(function(s){ return s.id; }).sort();
  return d;
}
function same(a, b){
  return Object.keys(b).every(function(k){
    if (k === 'tasks') return true;
    if (k === 'subs') return (a.subs||[]).slice().sort().join(',') === b.subs.slice().sort().join(',');
    return a[k] === b[k];
  });
}
var changed = function(){ return !same(S, BASE); };

function sum(list){ return list.reduce(function(t,x){ return t + x.amount; }, 0); }
function keptSubs(st){
  return PLAN.subs.filter(function(s){ return (st.subs||[]).indexOf(s.id) > -1; });
}
function flexTotal(st){
  return PLAN.flex.reduce(function(t,f){ return t + (Number(st[f.id])||0); }, 0);
}

/* The real starting point, once a bank is connected: everything in the bank today
   (connected accounts and the ones entered by hand), in the month it is today. The
   forecast then runs from here instead of the plan's snapshot. */
function anchor(){
  if (!hasBank()) return null;
  var ci = monthIndexOf(todayStr()), bal = inTheBank();
  if (!inRange(ci) || bal === null) return null;
  return { ci: ci, bal: bal };
}
/* One-offs the plan takes off month i, the gemeente included when it lands there. */
function plannedOneOffsOut(i, st){
  var key = PLAN.months[i].key;
  return (PLAN.oneOffs || []).filter(function(o){ return o.month === key && o.amount < 0; })
    .reduce(function(t, o){ return t - o.amount; }, 0) + (i > 0 && st.gem === key ? PLAN.gemeente.amount : 0);
}
function extrasFor(m, st, items){
  (PLAN.extras||[]).forEach(function(e){
    var v = Number(st[e.id])||0;
    if (!v) return;
    if (m.key === e.from || afterKey(m.key, e.from)) items.push({ name:e.label, amount: e.sign * v });
  });
}
/* What is still to come in the month the anchor sits in: the rest of the everyday
   budget, and whatever part of the bills, debt payments and one-offs the bank has not
   shown yet. The salary counts only until a payment that size has arrived. */
function restOfMonth(i, st, subsT){
  var items = [], m = PLAN.months[i], e = envelope(i, st), list = bankIn(i);
  var everyday = cents(Math.max(0, e.budget - e.spent));
  if (everyday) items.push({ name:'Everyday, rest of the month', amount: -everyday });
  var left = stillToCome(i, st, list);
  if (i > 0){
    if (left.bills) items.push({ name:'Bills still to come', amount: -left.bills });
    if (left.debt) items.push({ name:'Debt payments still to come', amount: -left.debt });
    if (m.key === PLAN.salary.from || afterKey(m.key, PLAN.salary.from)){
      var sal = Number(st.salary) || 0;
      /* Only real money in: not a move between own accounts, not money out of savings. */
      var arrived = list.some(function(c){ return c.b === 'in' && !c.own && !c.hidden && c.t.amt >= sal * 0.7; });
      if (sal && !arrived) items.push({ name:'Salary', amount: sal });
    }
    extrasFor(m, st, items);
  }
  (PLAN.oneOffs || []).forEach(function(o){ if (o.month === m.key && o.amount > 0) items.push({ name:o.name, amount:o.amount }); });
  if (left.oneoff) items.push({ name:'One-offs still to come', amount: -left.oneoff });
  return items;
}
/* What the plan still expects to go out in month i, item by item. A bank payment pays
   only the plan items whose payee it names, so a card bill or an unplanned debt payment
   never makes a loan look paid. A payment someone put in a bucket by hand and that
   names no item pays that bucket's items instead. */
function stillToCome(i, st, list){
  var key = PLAN.months[i].key, plan = [];
  function add(x, b, amount){ plan.push({ b:b, left:amount, terms: itemTerms(x) }); }
  /* Order matters when one payee pays two items: a named one-off (the October Amex
     bill) first, the monthly items next, the gemeente's lump sum after its monthly part. */
  (PLAN.oneOffs || []).forEach(function(o){ if (o.month === key && o.amount < 0) add(o, 'oneoff', -o.amount); });
  if (i > 0){
    (PLAN.fixed || []).forEach(function(x){ add(x, 'bills', x.amount); });
    keptSubs(st).forEach(function(x){ add(x, 'bills', x.amount); });
    (PLAN.loans || []).forEach(function(x){ add(x, 'debt', x.amount); });
    if (st.gem === key) add({ payee: (PLAN.gemeente.payee || ['Gemeente', 'Belastingen', 'Belastingsamenwerking']) }, 'oneoff', PLAN.gemeente.amount);
  }
  function pay(c, items){
    var amt = c.out;
    items.forEach(function(x){ var p = Math.min(amt, x.left); x.left -= p; amt -= p; });
  }
  list.forEach(function(c){
    if (!c.counts || c.b === 'everyday' || c.out <= 0) return;
    var hay = ' ' + normText(c.t.who + ' ' + (c.t.desc || '')).join(' ') + ' ';
    var named = plan.filter(function(x){ return x.terms.some(function(w){ return hay.indexOf(' ' + w + ' ') > -1; }); });
    if (named.length) pay(c, named);
    else if (c.src === 'tag') pay(c, plan.filter(function(x){ return x.b === c.b; }));
  });
  var out = { bills:0, debt:0, oneoff:0 };
  plan.forEach(function(x){ out[x.b] += Math.max(0, x.left); });
  return { bills: cents(out.bills), debt: cents(out.debt), oneoff: cents(out.oneoff) };
}

function model(st){
  var subsT = sum(keptSubs(st));
  var monthly = sum(PLAN.fixed) + sum(PLAN.loans) + subsT + flexTotal(st);
  var A = anchor();
  var bal = A ? A.bal : PLAN.start, M = [];
  var first = PLAN.months[A ? A.ci : 0].key;

  PLAN.months.forEach(function(m, i){
    if (A && i < A.ci) return;
    var items = [];
    if (A && i === A.ci){
      items = restOfMonth(i, st, subsT);
      items.forEach(function(it){ bal += it.amount; });
      bal = bridgeIn(m, bal, items);
      M.push({ key:m.key, label:m.label, items:items, bal:bal, bridged: bridgedIn(items) });
      return;
    }
    if (i === 0){
      var e0 = envelope(0, st);
      var spentNow = (Number(st.sept) || 0) + e0.logged + e0.bank;
      if (spentNow) items.push({ name:'Spending', amount: -spentNow });
    }
    /* Bank one-offs beyond the ones the plan already takes off this month. */
    var off = cents(Math.max(0, oneOffsIn(i) - plannedOneOffsOut(i, st)));
    if (off) items.push({ name:'One-offs', amount: -off });
    var cameIn = envelope(i, st).income;
    if (cameIn) items.push({ name:'Money in', amount: cameIn });
    if (i > 0){
      if (m.key === PLAN.salary.from || afterKey(m.key, PLAN.salary.from)) {
        items.push({ name:'Salary', amount: Number(st.salary)||0 });
      }
      items.push({ name:'Monthly budget', amount: -monthly });
      var over = overBudget(i, st);
      if (over) items.push({ name:'Over budget', amount: -over });
      (PLAN.oneOffs||[]).forEach(function(o){
        if (o.month === m.key) items.push({ name:o.name, amount:o.amount });
      });
      if (st.gem === m.key) items.push({ name:'Gemeente', amount: -PLAN.gemeente.amount });
      extrasFor(m, st, items);
    }
    items.forEach(function(it){ bal += it.amount; });
    bal = bridgeIn(m, bal, items);
    M.push({ key:m.key, label:m.label, items:items, bal:bal, bridged: bridgedIn(items) });
  });

  var by = {};
  M.forEach(function(m){ by[m.key] = m; });
  return { M:M, by:by, monthly:monthly, subsT:subsT, end:M[M.length-1].bal, first:first };
}
/* The bridge covers one month (bridge.month) and no more than bridge.max: only what
   it takes to bring that month back to zero. A month still below zero is not covered. */
function bridgeIn(m, bal, items){
  var b = PLAN.bridge || {};
  if (m.key !== b.month || bal >= 0) return bal;
  var amt = cents(b.max ? Math.min(-bal, b.max) : -bal);
  items.push({ name: b.label, amount: amt, bridge: true });
  return bal + amt;
}
function bridgedIn(items){
  var x = items.filter(function(it){ return it.bridge; })[0];
  return x ? x.amount : 0;
}
function afterKey(key, from){
  var order = PLAN.months.map(function(m){ return m.key; });
  return order.indexOf(key) > order.indexOf(from);
}

/* The stretch that dips below zero, as a run of month indices. */
function dip(M){
  var lo = -1, hi = -1;
  M.forEach(function(m,i){ if (m.bal < 0){ if (lo < 0) lo = i; hi = i; } });
  return lo < 0 ? null : { lo:lo, hi:hi };
}

/* ─────────────────────────── sync ─────────────────────────── */

function cacheKey(){ return 'runway-cache-' + CODE; }
function outboxKey(){ return 'runway-outbox-' + CODE; }
function saveCache(state){
  store.set(cacheKey(), { plan:PLAN, state:state, rev:REMOTE.rev, by:REMOTE.by, updated:REMOTE.updated, spends:SPENDS });
}

function applyRemote(data){
  PLAN = data.plan;
  CUR = PLAN.currency || '€';
  BASE = defaults(PLAN);
  REMOTE = { rev: data.rev||0, by: data.by||null, updated: data.updated||null };
  var incoming = data.state ? Object.assign({}, BASE, data.state) : Object.assign({}, BASE);
  incoming.tasks = (data.state && data.state.tasks) || {};
  S = incoming;
  SPENDS = Array.isArray(data.spends) ? data.spends : [];
  if (data.bank) BANKINFO = data.bank;
  MATCH = null; CL = null;
  saveCache(data.state);
}

/* ── spend writes: queued first, sent in order, kept until the Worker says yes ── */

function saveOutbox(){ store.set(outboxKey(), OUTBOX); }
function newId(){
  var s = '';
  while (s.length < 12) s += Math.random().toString(36).slice(2);
  return s.slice(0, 12);
}
function queueSpend(spend, by){
  OUTBOX.push({ op:'put', spend:spend, by: by === undefined ? (ME || null) : by });
  saveOutbox();
  flush();
}
function queueDelete(id){
  OUTBOX.push({ op:'del', id:id });
  saveOutbox();
  flush();
}

async function flush(){
  if (sending || !OUTBOX.length) return;
  sending = true;
  renderSpends();
  while (OUTBOX.length){
    var op = OUTBOX[0], res = null;
    try {
      res = op.op === 'put'
        ? await fetch(API + '/api/spend/' + CODE, {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ by: op.by, spend: { id:op.spend.id, d:op.spend.d, cat:op.spend.cat, dir:op.spend.dir, amt:op.spend.amt, note:op.spend.note || '' } })
          })
        : await fetch(API + '/api/spend/' + CODE + '/' + op.id, {
            method:'DELETE', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ by: ME || null })
          });
    } catch(e){ res = null; }
    if (!res || res.status >= 500 || res.status === 429){ sendFailed = true; break; }
    var out = res.ok ? await res.json().catch(function(){ return null; }) : null;
    /* A 4xx will not get better by retrying; it leaves the queue, and says so. */
    if (!res.ok && op.op === 'put') refused++;
    if (OUTBOX[0] === op) OUTBOX.shift();
    saveOutbox();
    if (out && out.ok){
      if (op.op === 'put' && out.spend){
        SPENDS = SPENDS.filter(function(s){ return s.id !== out.spend.id; }).concat([out.spend]);
      } else if (op.op === 'del'){
        SPENDS = SPENDS.filter(function(s){ return s.id !== op.id; });
      }
      saveCache(stateForCache());
    }
    sendFailed = false;
  }
  sending = false;
  renderSpends();
}
function stateForCache(){ var c = store.get(cacheKey()); return c ? c.state : null; }
function renderSpends(){ if (PLAN && S) render(); }

/* One line about writes still on this phone, or '' when there are none. */
function sendStatus(){
  var n = OUTBOX.length;
  if (refused) return { warn:true, text: refused === 1 ? 'One spend was refused and not saved.' : refused + ' spends were refused and not saved.' };
  if (!n) return null;
  if (sending && !sendFailed) return { warn:false, text:'saving…' };
  return { warn:true, text: (n === 1 ? '1 change' : n + ' changes') + ' not sent yet · will retry' };
}

async function pull(){
  var res = await fetch(API + '/api/plan/' + CODE, { cache:'no-store' });
  if (!res.ok) throw new Error(res.status === 404 ? 'no plan for this code' : 'could not reach the plan');
  return res.json();
}

async function poll(){
  if (document.hidden) return;
  if (OUTBOX.length) await flush();
  if (dirty) return;
  try {
    var data = await pull();
    var bankMoved = false;
    if (data.bank){
      BANKINFO = data.bank;
      if (bankKey && data.bank.rev !== BANKREV){ BANKREV = data.bank.rev; bankMoved = await pullBank(); }
    }
    if ((data.rev||0) === REMOTE.rev){ if (bankMoved){ render(); renderSheet(); } return; }
    var keepPage = page;
    applyRemote(data);
    page = keepPage;
    render();
  } catch(e){ /* stay on what we have */ }
}

function push(){
  dirty = true;
  renderLive();
  clearTimeout(pushTimer);
  pushTimer = setTimeout(async function(){
    var body = { by: ME || null, state: {
      sept:S.sept, salary:S.salary, gem:S.gem, subs:S.subs, tasks:S.tasks
    }};
    PLAN.flex.forEach(function(f){ body.state[f.id] = S[f.id]; });
    (PLAN.extras||[]).forEach(function(e){ body.state[e.id] = S[e.id]; });
    try {
      var res = await fetch(API + '/api/state/' + CODE, {
        method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
      });
      if (res.ok){
        var out = await res.json();
        REMOTE = { rev: out.rev, by: ME || null, updated: out.updated };
      }
    } catch(e){ /* it will go up on the next change */ }
    dirty = false;
    saveCache(body.state);
    renderLive();
  }, 700);
}

async function resetAll(){
  S = Object.assign({}, BASE, { tasks: S.tasks });
  render();
  try {
    var res = await fetch(API + '/api/state/' + CODE, {
      method:'DELETE', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ by: ME || null })
    });
    if (res.ok){ var out = await res.json(); REMOTE = { rev: out.rev, by: ME||null, updated: out.updated }; }
  } catch(e){}
  renderLive();
}

/* ─────────────────────────── the bank ───────────────────────────
   Balances and booked payments from the connected banks, read through the Worker
   behind a PIN. Plan and state need only the link; this needs the key a phone gets
   by entering the PIN once. Without it the app works exactly as before.

   Every payment falls in one bucket: bills (a payee matching the plan's fixed costs
   or subscriptions), debt payments (matching its loans), one-offs (only by a rule
   or a person's choice), everyday (everything else). Money in is its own thing,
   unless someone moves it into a bucket, where it counts as a refund. A person's
   choice for one payment beats a payee rule, which beats the plan. The bank is the
   record: amounts and dates are never edited here. */

var BANK = null;                              // { conns, synced, rev, tx:{list}, tags:{pay,payee} }
var BANKINFO = { pin:false, conns:0, rev:0 };  // from the plan GET, needs no PIN
var BANKREV = -1;
var bankKey = null;
var bankMsg = '';
var BANKS_LIST = null, bankCountry = 'NL', bankQuery = '';
var payFilter = { b:'all', k:'all', q:'', m:null, hidden:false };
var SEEN = null;
var CL = null;                                 // classified payments, rebuilt when BANK changes

var BUCKETS = [['everyday','Everyday'],['bills','Bills'],['debt','Debt payments'],['oneoff','One-offs']];
function bucketLabel(b){
  if (b === 'in') return 'Money in';
  if (b === 'save') return 'To savings';
  if (b === 'check') return 'To sort';
  var x = BUCKETS.filter(function(p){ return p[0] === b; })[0];
  return x ? x[1] : b;
}

function bankKeyName(){ return 'runway-bankkey-' + CODE; }
function bankCacheName(){ return 'runway-bank-' + CODE; }
function seenName(){ return 'runway-seen-' + CODE; }
function hasBank(){ return !!(BANK && BANK.conns && BANK.conns.length); }

async function bankFetch(path, opts){
  opts = opts || {};
  var headers = { 'Content-Type':'application/json' };
  if (bankKey) headers['X-Runway-Key'] = bankKey;
  var res = await fetch(API + path, {
    method: opts.method || 'GET', headers: headers, cache:'no-store',
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  var data = await res.json().catch(function(){ return null; });
  /* The key was withdrawn (the PIN changed, or this phone was forgotten). */
  if (res.status === 401 && data && data.locked) dropBank();
  return { ok: res.ok, status: res.status, data: data };
}
function dropBank(){
  bankKey = null; BANK = null; CL = null; BANKREV = -1;
  store.set(bankKeyName(), null);
  store.set(bankCacheName(), null);
}
function setBank(data){
  BANK = data; CL = null;
  store.set(bankCacheName(), data);
  /* The first batch from an account this phone has not seen before counts as seen:
     ninety days of new-dots would say nothing. SEEN._k lists those accounts. */
  SEEN = SEEN || {};
  var known = SEEN._k || [], fresh = {}, any = false;
  txList().forEach(function(t){ if (known.indexOf(t.k) === -1) fresh[t.k] = 1; });
  if (Object.keys(fresh).length){
    txList().forEach(function(t){ if (fresh[t.k]){ SEEN[t.id] = 1; any = true; } });
    SEEN._k = known.concat(Object.keys(fresh));
  }
  if (any) store.set(seenName(), SEEN);
}
async function pullBank(){
  if (!bankKey) return false;
  try {
    var r = await bankFetch('/api/bank/' + CODE);
    if (r.ok && r.data){ setBank(r.data); return true; }
  } catch(e){}
  return false;
}

function txList(){ return (BANK && BANK.tx && BANK.tx.list) || []; }
function tags(){ return (BANK && BANK.tags) || { pay:{}, payee:{} }; }

/* Same normalising as the Worker's payeeKey: lower case, letters only, and for a
   rule key only the first three words, so a branch number does not make a new payee. */
function normText(s){
  return String(s || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z ]+/g, ' ').trim().split(/\s+/).filter(Boolean);
}
function payeeKey(s){ return normText(s).slice(0, 3).join(' '); }
function payeeOf(t){ return t.who || t.desc || ''; }
/* The rule key as words a person reads: "albert heijn" → "Albert Heijn". */
function payeeName(s){
  return payeeKey(s).replace(/[a-z]/g, function(c){ return c.toUpperCase(); });
}

/* The plan's own hints: fixed costs and kept subscriptions are bills, loans are debt
   payments. An item can name its payee (`payee`, a string or a list); otherwise its
   name is tried. Plan rules (`bank.rules`) come first. Words match whole. */
var MATCH = null;
function itemTerms(x){
  var t = x.payee || x.name;
  return (Array.isArray(t) ? t : [t]).map(function(s){ return normText(s).join(' '); })
    .filter(function(s){ return s.length >= 3; });
}
function matchers(){
  if (MATCH && MATCH.plan === PLAN) return MATCH.list;
  var list = [], terms = itemTerms;
  ((PLAN.bank && PLAN.bank.rules) || []).forEach(function(r){ list.push({ terms: terms({ payee:r.match }), b:r.b }); });
  (PLAN.fixed || []).forEach(function(x){ list.push({ terms: terms(x), b:'bills' }); });
  (PLAN.subs || []).filter(function(s){ return !s.cancelled; }).forEach(function(x){ list.push({ terms: terms(x), b:'bills' }); });
  (PLAN.loans || []).forEach(function(x){ list.push({ terms: terms(x), b:'debt' }); });
  MATCH = { plan: PLAN, list: list };
  return list;
}

/* Money put aside is not spending: an ABN spaarrekening, Direct Sparen, a Revolut
   vault or pocket. Matched on the payee and the description, whole words. */
var SAVINGS = /(^| )(spaar[a-z]*|sparen|direct sparen|savings?|vaults?|pockets?|deposito|vermogen[a-z]*)( |$)/;
/* A payment this big that nothing recognises is not everyday spending until someone
   says so: it waits in To sort and counts nowhere. */
/* Cash out of a machine: ABN writes GEA or Geldautomaat, Revolut "Cash withdrawal". */
var ATM = /(^| )(gea|geldautomaat|geldopname|atm|cash withdrawal)( |$)/;
function bigAmount(){ return (PLAN.bank && PLAN.bank.big) || 500; }

function classify(t){
  var tg = tags(), tag = tg.pay[t.id] || {}, rule = tg.payee[payeeKey(payeeOf(t))] || null;
  var c = { t:t, tag:tag, rule:rule, hidden: !!tag.hide, ns: !!(tag.ns || t.own), own: !!t.own, flag: !!tag.flag };
  if (tag.b){ c.b = tag.b; c.src = 'tag'; }
  else if (rule){ c.b = rule.b; c.src = 'payee'; }
  else {
    var words = normText(t.who + ' ' + (t.desc || '')).join(' ');
    var hay = ' ' + words + ' ';
    if (SAVINGS.test(words)){ c.b = 'save'; c.src = 'auto'; c.ns = true; }
    else if (t.amt > 0){ c.b = 'in'; c.src = 'auto'; }
    else {
      var m = matchers().filter(function(x){
        return x.terms.some(function(w){ return hay.indexOf(' ' + w + ' ') > -1; });
      })[0];
      if (m){ c.b = m.b; c.src = 'plan'; }
      else if (-t.amt >= bigAmount()){ c.b = 'check'; c.src = 'auto'; }
      else { c.b = 'everyday'; c.src = 'auto'; }
    }
  }
  /* What it takes from a bucket: a debit adds, a credit moved into a bucket is a refund.
     Money in, savings and big payments still to sort count nowhere. */
  c.counts = !c.hidden && !c.ns && c.b !== 'in' && c.b !== 'save' && c.b !== 'check';
  c.out = -t.amt;
  c.atm = t.amt < 0 && (t.mcc === '6011' || ATM.test(normText(t.who + ' ' + (t.desc || '')).join(' ')));
  c.pocket = pocketOfAcct(t.k);
  return c;
}
function classified(){
  if (!CL) CL = txList().map(classify);
  return CL;
}
/* The pockets: an account (by key) that holds the money for one everyday budget.
   Linked on the Bank screen, kept in tags.acct, so they sit behind the PIN too. */
function pocketOfAcct(k){
  var a = (tags().acct || {})[k];
  return a && PLAN.flex.some(function(f){ return f.id === a.p; }) ? a.p : null;
}
function pocketAcct(flexId){
  var ac = tags().acct || {}, k = Object.keys(ac).filter(function(x){ return ac[x].p === flexId; })[0];
  return k ? accountOf(k) : null;
}
function hasPockets(){ return hasBank() && PLAN.flex.some(function(f){ return pocketAcct(f.id); }); }

/* Payments counted in month i; month 0 only from PLAN.asOf, like spendsIn(). */
function bankIn(i){
  if (!hasBank()) return [];
  return classified().filter(function(c){
    return monthIndexOf(c.t.d) === i && (i > 0 || c.t.d >= PLAN.asOf);
  });
}
function bucketSum(list, b){
  return cents(list.reduce(function(s, c){ return s + (c.counts && c.b === b ? c.out : 0); }, 0));
}

function accountOf(k){
  var out = null;
  ((BANK && BANK.conns) || []).forEach(function(c){
    (c.accounts || []).forEach(function(a){ if (a.k === k) out = { bank:c.bank, conn:c, a:a }; });
  });
  return out;
}
function bankShort(name){ return String(name || '').replace(/\s+(Bank|N\.?V\.?|UAB)$/i, ''); }
/* Accounts the bank sync cannot see, entered by hand in the plan (bank.manual). */
function manualAccounts(){ return (PLAN && PLAN.bank && PLAN.bank.manual) || []; }
/* A hand-entered savings balance moves with the transfers the bank shows after its
   date: money put aside at the same bank adds to it, money taken out of savings into
   a connected account comes off it. Otherwise a standing order out of savings would
   be counted twice, once in each account. */
function savingsMoves(m){
  if (!hasBank() || !m.asOf) return 0;
  var bank = String(m.bank || '').toLowerCase();
  return cents(classified().reduce(function(t, c){
    if (c.b !== 'save' || c.own || c.hidden || c.t.d <= m.asOf) return t;
    var a = accountOf(c.t.k);
    if (bank && (!a || bankShort(a.bank).toLowerCase().indexOf(bankShort(bank).toLowerCase()) !== 0)) return t;
    return t - c.t.amt;
  }, 0));
}
function manualBal(m){ return cents(Number(m.bal) + savingsMoves(m)); }
function manualRowsHtml(){
  return manualAccounts().map(function(m){
    var moved = savingsMoves(m);
    return '<div class="row"><span class="grow"><b>' + esc(m.name) + '</b><span class="sub">' +
      esc((m.bank ? m.bank + ' · ' : '') + 'entered by hand' + (m.asOf ? ', ' + shortDate(m.asOf) : '') +
        (moved ? ' · ' + (moved > 0 ? '+' : '−') + fmt(Math.abs(moved)) + ' moved since' : '')) + '</span></span>' +
      '<span class="amt">' + esc(fmt(manualBal(m))) + '</span></div>';
  }).join('');
}
function inTheBank(){
  var sum = 0, n = 0;
  manualAccounts().forEach(function(m){ if (Number.isFinite(Number(m.bal))){ sum += manualBal(m); n++; } });
  ((BANK && BANK.conns) || []).forEach(function(c){
    (c.accounts || []).forEach(function(a){
      if (a.bal !== null && a.bal !== undefined && (!a.cur || a.cur === 'EUR')){ sum += a.bal; n++; }
    });
  });
  return n ? cents(sum) : null;
}
function isNew(c){ return SEEN && !SEEN[c.t.id]; }
function markSeen(){
  if (!hasBank()) return;
  SEEN = SEEN || {};
  txList().forEach(function(t){ SEEN[t.id] = 1; });
  store.set(seenName(), SEEN);
}
/* A consent ends; a week before, the bank row says so. */
function consentNote(c){
  if (c.status === 'expired') return { warn:true, text:'Needs reconnecting' };
  if (c.status === 'error') return { warn:true, text:'Last sync failed' + (c.err === 'rate_limited' ? ': the bank asked to wait' : '') };
  if (c.until){
    var days = Math.floor((Date.parse(c.until) - Date.now()) / 864e5);
    if (days <= 7) return { warn:true, text:'Access ends ' + shortDate(c.until.slice(0, 10)) + ' · reconnect to keep it' };
    return { warn:false, text:'Access until ' + shortDate(c.until.slice(0, 10)) };
  }
  return { warn:false, text:'' };
}

/* ── tags: a change shows at once, goes to the Worker, and can be undone ── */

function applyTag(body){
  var tg = BANK.tags = BANK.tags || { pay:{}, payee:{} };
  tg.pay = tg.pay || {}; tg.payee = tg.payee || {};
  var by = ME || null, at = new Date().toISOString();
  if (typeof body.acct === 'string'){
    var ac = tg.acct = tg.acct || {};
    if (body.pocket === null) delete ac[body.acct];
    else {
      Object.keys(ac).forEach(function(k){ if (ac[k].p === body.pocket) delete ac[k]; });
      ac[body.acct] = { p: body.pocket, by: by, at: at };
    }
  } else if (typeof body.payee === 'string'){
    var p = payeeKey(body.payee);
    if (body.b === null) delete tg.payee[p]; else tg.payee[p] = { b: body.b, by: by, at: at };
  } else {
    var cur = Object.assign({}, tg.pay[body.id] || {});
    delete cur.by; delete cur.at;
    if ('b' in body){ if (body.b === null) delete cur.b; else cur.b = body.b; }
    ['ns','hide','flag'].forEach(function(f){ if (f in body){ if (body[f]) cur[f] = 1; else delete cur[f]; } });
    if (Object.keys(cur).length) tg.pay[body.id] = Object.assign(cur, { by: by, at: at });
    else delete tg.pay[body.id];
  }
  CL = null;
}
/* The body that puts one payment's tag, or one payee rule, back as it is now. */
function undoFor(body){
  var tg = tags();
  if (typeof body.acct === 'string'){
    var was = (tg.acct || {})[body.acct];
    return { acct: body.acct, pocket: was ? was.p : null };
  }
  if (typeof body.payee === 'string'){
    var r = tg.payee[payeeKey(body.payee)];
    return { payee: body.payee, b: r ? r.b : null };
  }
  var t = tg.pay[body.id] || {};
  return { id: body.id, b: t.b || null, ns: !!t.ns, hide: !!t.hide, flag: !!t.flag };
}
var undoTag = null, undoTagTimer = null;
async function tagWrite(bodies, msg, isUndo){
  if (!BANK) return;
  var back = bodies.map(undoFor).reverse();
  bodies.forEach(applyTag);
  store.set(bankCacheName(), BANK);
  if (!isUndo){
    undoItem = null;
    undoTag = { msg: msg, bodies: back };
    clearTimeout(undoTagTimer);
    undoTagTimer = setTimeout(function(){ undoTag = null; renderUndo(); }, 6000);
  } else {
    undoTag = null;
  }
  render(); renderSheet();
  for (var i = 0; i < bodies.length; i++){
    var r = null;
    try { r = await bankFetch('/api/tag/' + CODE, { method:'POST', body: Object.assign({ by: ME || null }, bodies[i]) }); }
    catch(e){ r = null; }
    if (!r || !r.ok){
      /* Put the screen back the way the Worker has it. */
      back.forEach(applyTag);
      undoTag = null;
      bankMsg = 'That change did not save. Check the connection and try again.';
      await pullBank();
      render(); renderSheet();
      return;
    }
  }
}

/* ── PIN ── */

var pinDraft = null;   // { mode:'unlock'|'set'|'confirm'|'change', digits:'', first:'', err:'', then:null }

function openPin(mode, then){
  pinDraft = { mode: mode, digits:'', first:'', err:'', then: then || null };
  openSheet('pin');
}
function pinKey(k){
  if (!pinDraft) return;
  if (k === 'del') pinDraft.digits = pinDraft.digits.slice(0, -1);
  else if (/^\d$/.test(k) && pinDraft.digits.length < 8) pinDraft.digits += k;
  pinDraft.err = '';
  renderSheet();
}
async function pinSubmit(){
  var d = pinDraft, p = d.digits;
  if (p.length < 4){ d.err = 'Four to eight digits.'; return renderSheet(); }
  if (d.mode === 'set' || d.mode === 'change'){
    d.first = p; d.digits = ''; d.mode = d.mode === 'set' ? 'confirm' : 'confirm-change';
    return renderSheet();
  }
  if ((d.mode === 'confirm' || d.mode === 'confirm-change') && p !== d.first){
    d.digits = ''; d.first = ''; d.mode = d.mode === 'confirm' ? 'set' : 'change';
    d.err = 'Those did not match. Choose it again.';
    return renderSheet();
  }
  d.err = 'checking…'; renderSheet();
  var path = d.mode === 'unlock' ? '/api/unlock/' : '/api/pin/';
  var r;
  try { r = await bankFetch(path + CODE, { method:'POST', body:{ pin: p, by: ME || null } }); }
  catch(e){ d.err = 'Could not reach the Worker.'; d.digits = ''; return renderSheet(); }
  if (r.ok && r.data && r.data.key){
    bankKey = r.data.key;
    store.set(bankKeyName(), bankKey);
    var then = d.then;
    closeSheet();
    await pullBank();
    if (then) then();
    render();
    return;
  }
  d.digits = '';
  if (r.status === 423) d.err = 'Too many wrong tries. Locked until ' +
    new Date(r.data.until).toLocaleString('en-GB', { weekday:'short', hour:'2-digit', minute:'2-digit' }) + '.';
  else if (r.status === 429) d.err = 'Too many tries. Wait a minute.';
  else if (r.status === 403) d.err = 'Wrong PIN. ' + r.data.left + (r.data.left === 1 ? ' try' : ' tries') + ' left.';
  else if (r.status === 409){ d.mode = 'unlock'; d.err = 'A PIN is already set. Enter it.'; }
  else if (r.status === 404 && r.data && r.data.nopin){ d.mode = 'set'; d.err = 'No PIN yet. Choose one.'; }
  else d.err = 'That did not work (' + r.status + ').';
  renderSheet();
}

/* ── connecting ── */

async function loadBanks(){
  BANKS_LIST = 'loading';
  render();
  var r = null;
  try { r = await bankFetch('/api/bank/' + CODE + '/banks?country=' + bankCountry); } catch(e){}
  BANKS_LIST = r && r.ok ? r.data.banks : { error: (r && r.data && r.data.error) || 'unreachable', detail: (r && r.data && r.data.detail) || '' };
  render();
}
async function connectBank(name, country){
  bankMsg = 'Opening ' + name + '…';
  render();
  var r = null;
  try { r = await bankFetch('/api/bank/' + CODE + '/connect', { method:'POST', body:{ name:name, country:country, by: ME || null } }); }
  catch(e){}
  if (r && r.ok && r.data.url){ location.href = r.data.url; return; }
  bankMsg = 'Could not start: ' + ((r && r.data && (r.data.detail || r.data.error)) || 'no connection') + '.';
  render();
}
async function syncNow(){
  bankMsg = 'Syncing…';
  render();
  var r = null;
  try { r = await bankFetch('/api/bank/' + CODE + '/sync', { method:'POST' }); } catch(e){}
  if (r && r.ok && r.data.skipped) bankMsg = 'Synced ' + ago(r.data.synced) + '. It can sync again ten minutes after.';
  else if (r && r.ok) bankMsg = r.data.added ? r.data.added + ' new ' + (r.data.added === 1 ? 'payment.' : 'payments.') : 'Up to date.';
  else bankMsg = 'The sync did not finish' + (r && r.data && r.data.errors && r.data.errors[0] ? ': ' + r.data.errors[0].kind.replace(/_/g, ' ') : '') + '.';
  await pullBank();
  render();
}
async function disconnectBank(id){
  var c = (BANK.conns || []).filter(function(x){ return x.id === id; })[0];
  if (!c || !confirm('Disconnect ' + c.bank + '? Its payments leave Runway, and reconnecting means logging in at the bank again.')) return;
  await bankFetch('/api/bank/' + CODE + '/disconnect', { method:'POST', body:{ conn:id } });
  await pullBank();
  bankMsg = c.bank + ' is disconnected.';
  render();
}
async function forgetPhone(){
  if (!confirm('Forget this phone? The bank stays connected; this phone needs the PIN again.')) return;
  try { await bankFetch('/api/lock/' + CODE, { method:'POST' }); } catch(e){}
  dropBank();
  render();
}

/* ─────────────────────────── charts ─────────────────────────── */

/* The first day an envelope counts from: month 0 starts at PLAN.asOf, like spendsIn(). */
function periodStart(e){ return e.index === 0 && PLAN.asOf > e.first ? PLAN.asOf : e.first; }

/* How far spending is behind (+) or ahead of (−) an even spread of the envelope,
   counting today as a day already allowed for. */
function paceOf(e){
  var start = periodStart(e), n = daysFrom(start, e.last) + 1;
  if (!(e.total > 0) || n < 1) return 0;
  var gone = Math.max(0, Math.min(n, daysFrom(start, todayStr()) + 1));
  return cents(e.total * gone / n - e.spent);
}

/* One bar per day of the envelope, the even spread as a dashed line. The width is
   a viewBox, so the chart scales with the column and never measures the page. */
function dailyHtml(e){
  var start = periodStart(e), n = daysFrom(start, e.last) + 1, today = todayStr();
  if (n < 1) return '';
  var per = {};
  e.list.forEach(function(s){ per[s.d] = (per[s.d] || 0) + s.amt; });
  var plan = e.total > 0 ? e.total / n : 0;
  var days = [], hi = plan * 2;
  for (var i = 0; i < n; i++){
    var d = addDays(start, i);
    days.push({ d:d, v:per[d] || 0 });
    hi = Math.max(hi, per[d] || 0);
  }
  var W = 342, base = 70, tall = 62, slot = W / n, g = '';
  var Y = function(v){ return base - (hi > 0 ? v / hi * tall : 0); };
  days.forEach(function(x, i){
    var cx = i * slot + slot / 2, w = Math.max(2, Math.min(9, slot * 0.6));
    if (x.d <= today){
      var h = Math.max(1.5, base - Y(x.v));
      g += '<rect x="' + (cx - w / 2).toFixed(1) + '" y="' + (base - h).toFixed(1) + '" width="' + w.toFixed(1) +
        '" height="' + h.toFixed(1) + '" fill="' + (x.d === today ? 'var(--green)' : 'var(--ink)') + '"/>';
    } else {
      g += '<circle cx="' + cx.toFixed(1) + '" cy="' + (base - 1) + '" r="1" fill="var(--muted)"/>';
    }
  });
  if (plan > 0){
    g += '<line x1="0" x2="' + W + '" y1="' + Y(plan).toFixed(1) + '" y2="' + Y(plan).toFixed(1) +
      '" stroke="var(--ink)" stroke-width="1" stroke-dasharray="2 3" opacity=".55"/>';
  }
  g += '<line x1="0" x2="' + W + '" y1="' + base + '" y2="' + base + '" stroke="var(--ink)" stroke-width="1"/>';
  [0, Math.floor((n - 1) / 2), n - 1].forEach(function(i){
    var p = ymdParts(days[i].d);
    g += '<text x="' + (i * slot + slot / 2).toFixed(1) + '" y="88" text-anchor="middle" font-size="10" fill="var(--muted)">' + p[2] + '</text>';
  });
  return '<div class="daily"><div class="top"><span class="eyebrow ink">Spent each day</span>' +
    (plan > 0 ? '<span class="small">dashes: ' + esc(fmt(plan)) + ' a day</span>' : '') + '</div>' +
    '<svg viewBox="0 0 ' + W + ' 92" role="img" aria-label="Spending per day in ' + esc(e.label) + '">' + g + '</svg></div>';
}

/* End-of-month balances as bars from one axis, one scale for both sides. */
function forecastBarsHtml(M){
  var pos = 0, neg = 0;
  M.forEach(function(m){ if (m.bal > pos) pos = m.bal; if (-m.bal > neg) neg = -m.bal; });
  var span = pos + neg || 1, axis = neg / span * 100;
  return '<div class="fc" role="img" aria-label="Balance at the end of each month">' + M.map(function(m){
    var w = Math.abs(m.bal) / span * 100, left = m.bal < 0 ? axis - w : axis;
    return '<div class="fc-r' + (m.bal < 0 ? ' neg' : '') + '"><span class="m">' + esc(m.key) + '</span>' +
      '<span class="track"><u style="left:' + axis.toFixed(2) + '%"></u><i style="left:' + left.toFixed(2) +
      '%;width:' + Math.max(0.6, w).toFixed(2) + '%"></i></span><span class="v">' + esc(fmt(m.bal)) + '</span></div>';
  }).join('') + '</div>';
}

/* ─────────────────────────── sound ───────────────────────────
   MU-TH-UR's voice, made here in Web Audio: the readout chatter when a screen
   comes up, a chunky key click on every press, a two-note chirp when something is
   kept, a low buzz when something is refused. No recordings. The phone's silent
   switch is honoured where Safari allows it (audioSession "ambient"), and the
   choice is kept per phone. Audio can only start from a tap, so the first tap
   wakes it. */
var SFX = (function(){
  var ctx = null, out = null, on = store.get('runway-sound') !== false, last = 0, armed = false;
  function wake(){
    if (!on || !armed) return null;   // before the first tap a sound would only queue up
    if (!ctx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { if (navigator.audioSession) navigator.audioSession.type = 'ambient'; } catch(e){}
      ctx = new AC();
      out = ctx.createGain(); out.gain.value = 0.11;
      var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5200;
      out.connect(lp); lp.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(type, freq, t, dur, vol){
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.004);
    g.gain.setValueAtTime(vol, t + dur - 0.006);
    g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.01);
  }
  var noiseBuf = null;
  function noise(t, dur, hp, vol){
    if (!noiseBuf){
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.1, ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    var src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = hp;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f); f.connect(g); g.connect(out); src.start(t); src.stop(t + dur);
  }
  /* A buzzy pulse: a low square wave through a band that brings out its upper
     harmonics, the dry relay buzz of a 1970s terminal. */
  function buzz(t, dur, freq, vol, centre){
    var o = ctx.createOscillator(), bp = ctx.createBiquadFilter(), g = ctx.createGain();
    o.type = 'square'; o.frequency.setValueAtTime(freq, t);
    bp.type = 'bandpass'; bp.frequency.value = centre || 1250; bp.Q.value = 0.9;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.002);
    g.gain.setValueAtTime(vol, t + Math.max(0.003, dur - 0.003));
    g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(bp); bp.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.01);
  }
  function busy(){ return now() >= last - 0.1; }   // one readout at a time
  function now(){ return ctx.currentTime; }
  /* Screen readout: fast pulse train, about 45 a second, pulses and gaps of
     5 to 25 ms, pitch wandering around 140 Hz. */
  function chatter(len){
    if (!wake() || !busy()) return;
    var t = now() + 0.01, end = t + (len || 0.5);
    while (t < end){
      var on = 0.005 + Math.random() * 0.02, off = 0.005 + Math.random() * 0.018;
      buzz(t, on, 128 + Math.random() * 26, 0.9, 1150 + Math.random() * 250);
      t += on + off;
    }
    last = end;
  }
  /* Sheet readout: slower mid tones in short groups with a pause between. */
  var MID = [525, 650, 750];
  function readout(len){
    if (!wake() || !busy()) return;
    var t = now() + 0.01, end = t + (len || 0.55), n = 0;
    while (t < end){
      tone('triangle', MID[(Math.random() * MID.length) | 0], t, 0.022 + Math.random() * 0.008, 0.55);
      t += 0.055 + Math.random() * 0.012;
      if (++n % (4 + ((Math.random() * 2) | 0)) === 0) t += 0.11;
    }
    last = end;
  }
  /* Key: a short heavy buzz with a click on top. */
  function key(){
    if (!wake()) return;
    var t = now() + 0.002;
    noise(t, 0.012, 2500, 0.5);
    buzz(t, 0.035, 140, 0.8, 600);
  }
  /* Kept: a high, pure beep trill. */
  function ok(){
    if (!wake()) return;
    var t = now() + 0.03;
    for (var i = 0; i < 6; i++){ tone('sine', 2600 + (i % 2) * 40, t, 0.025, 0.5); t += 0.05; }
  }
  /* Refused: two long low buzzes. */
  function no(){
    if (!wake()) return;
    var t = now() + 0.01;
    buzz(t, 0.16, 110, 1, 500);
    buzz(t + 0.22, 0.2, 110, 1, 500);
  }
  function set(v){
    on = !!v; store.set('runway-sound', on);
    if (!on && ctx) ctx.suspend();
    if (on){ wake(); chatter(0.35); }
    paint();
  }
  function paint(){
    var b = $('snd');
    if (b){ b.setAttribute('aria-pressed', String(on)); b.textContent = on ? 'Sound on' : 'Sound off'; }
  }
  function arm(){ armed = true; }
  return { arm:arm, chatter:chatter, readout:readout, key:key, ok:ok, no:no, set:set, paint:paint, isOn:function(){ return on; } };
})();

/* Every press is a key on MU-TH-UR's deck. Capture phase, so it sounds before the
   press changes the screen. */
document.addEventListener('pointerdown', function(e){
  SFX.arm();
  if (e.target.closest('button, select, label, a, input, summary') && !e.target.closest('#snd')) SFX.key();
}, true);

/* ─────────────────────────── the sheet ─────────────────────────── */

var sheetKind = null, draft = null, lastFocus = null, logDraft = null;

function openSheet(kind){
  SFX.readout();
  sheetKind = kind;
  draft = Object.assign({}, S, { subs: (S.subs||[]).slice() });
  if (kind === 'log') logDraft = { cat: lastCat(), day: 'today', dir: 'out' };
  lastFocus = document.activeElement;
  renderSheet();
  $('scrim').classList.add('open');
  $('sheet').classList.add('open');
  document.body.style.overflow = 'hidden';
  var f = kind === 'log' ? $('lg-amt') : $('sheet').querySelector('input,select,button');
  if (f) f.focus();
}
function closeSheet(){
  sheetKind = null;
  $('scrim').classList.remove('open');
  $('sheet').classList.remove('open');
  document.body.style.overflow = '';
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
function keepSheet(){
  SFX.ok();
  S = Object.assign({}, draft);
  closeSheet();
  push();
  render();
}

function resultRows(st){
  var now = model(st), plan = model(BASE);
  var rows = [
    ['A normal month', plan.monthly, now.monthly, true],
    ['By ' + PLAN.months[PLAN.months.length-1].label, plan.end, now.end, false]
  ];
  return '<div class="result">' + rows.map(function(r){
    var moved = Math.round(r[1]) !== Math.round(r[2]);
    return '<div class="r"><span class="m">' + esc(r[0]) + '</span><span class="g">' +
      (moved ? '<span class="was">' + fmt(r[1]) + '</span><span class="arrow">→</span>' : '') +
      '<span class="now">' + fmt(r[2]) + '</span></span></div>';

function sliderHtml(id, label, min, max, step, val, planVal){

var payDraft = null;   // { id, b } while a payment's sheet is open; b is a bucket picked but not yet scoped
function togRow(f, label, sub, on){
  return '<label class="row"><span class="grow"><b>' + esc(label) + '</b><span class="sub">' + esc(sub) + '</span></span>' +
    '<input type="checkbox" class="sw" data-tog="' + f + '"' + (on ? ' checked' : '') + ' aria-label="' + esc(label) + '"></label>';
}
function openPayment(id){
  payDraft = { id: id, b: null };
  if (SEEN && !SEEN[id]){ SEEN[id] = 1; store.set(seenName(), SEEN); }
  openSheet('pay');
}
function movePayment(scope){
  var c = classified().filter(function(x){ return x.t.id === payDraft.id; })[0];
  var b = payDraft.b;
  if (!c || !b) return;
  payDraft.b = null;
  var name = c.t.who || 'this payment';
  if (scope === 'always'){
    /* The rule should decide; a hand-set bucket on this payment would outvote it. */
    var bodies = [{ payee: payeeOf(c.t), b: b }];
    if (c.tag.b) bodies.push({ id: c.t.id, b: null });
    return tagWrite(bodies, 'Every ' + payeeName(payeeOf(c.t)) + ' → ' + bucketLabel(b));
  }
  /* Moving back to where the payee rule or the plan would put it clears the choice. */
  var natural = classify({ id:'x', k:c.t.k, d:c.t.d, amt:c.t.amt, who:c.t.who, desc:c.t.desc });
  tagWrite([{ id: c.t.id, b: natural.b === b ? null : b }], name + ' → ' + bucketLabel(b));
}

/* ── logging a spend: plain functions the sheet calls ── */

function lastCat(){
  var c = store.get('runway-lastcat');
  var ids = PLAN.flex.map(function(f){ return f.id; });
  return ids.indexOf(c) > -1 ? c : ids[ids.length - 1];
}
function flexLabel(id){
  if (id === 'in') return 'Money in';
  var f = PLAN.flex.filter(function(x){ return x.id === id; })[0];
  return f ? f.label : id;
}
/* "12,50", "12.50", "€ 1.234,56" and "1,234.56" all read as the number meant:
   the last comma or dot is the decimal point, any earlier one groups thousands. */
function parseAmount(v){
  var s = String(v || '').replace(/[^\d.,]/g, '');
  if (!s) return NaN;
  var k = Math.max(s.lastIndexOf(','), s.lastIndexOf('.'));
  if (k > -1 && s.length - k - 1 <= 2) s = s.slice(0, k).replace(/[.,]/g, '') + '.' + s.slice(k + 1);
  else s = s.replace(/[.,]/g, '');
  return Number(s);
}
function logDate(day){ return day === 'yesterday' ? addDays(todayStr(), -1) : todayStr(); }

/* The sentence above the form: what is left where this spend lands, and after it. */
function logHint(amt){
  var d = logDate(logDraft.day), i = monthIndexOf(d);
  if (!inRange(i)) return 'Outside the months this plan covers.';
  var e = envelope(i), now, what;
  if (logDraft.dir === 'in'){
    var s0 = 'Left for ' + e.label + ': ' + fmtLeft(e.left);
    return amt > 0 ? s0 + ' → ' + fmtLeft(cents(e.left + amt)) + ' after this' : s0;
  }
  if (i === 0){ now = e.left; what = 'Left for ' + e.label; }
  else {
    var c = e.cats.filter(function(x){ return x.id === logDraft.cat; })[0];
    now = c ? c.left : e.left;
    what = flexLabel(logDraft.cat) + ', ' + e.label;
  }
  var s = what + ': ' + fmtLeft(now);
  if (amt > 0) s += ' → ' + fmtLeft(cents(now - amt)) + ' after this';
  return s;
}

/* Reads the open sheet into a spend, or returns { error }. */
function spendFromSheet(){
  var amt = cents(parseAmount($('lg-amt').value));
  if (!(amt > 0)) return { error:'Type an amount.' };
  if (amt > 100000) return { error:'That is more than one spend can be.' };
  var note = $('lg-note').value.replace(/[\u0000-\u001f\u007f-\u009f]/g, '').trim().slice(0, 60).trim();
  var s = logDraft.dir === 'in'
    ? { id:newId(), d:logDate(logDraft.day), cat:'in', dir:'in', amt:amt }
    : { id:newId(), d:logDate(logDraft.day), cat:logDraft.cat, amt:amt };
  if (note) s.note = note;
  return { spend:s };
}
function saveSpend(){
  var r = spendFromSheet();
  if (r.error){ SFX.no(); $('lg-err').textContent = r.error; $('lg-amt').focus(); return; }
  SFX.ok();
  if (!isIn(r.spend)) store.set('runway-lastcat', r.spend.cat);
  closeSheet();
  queueSpend(r.spend);
  render();
}

/* Deleting asks nothing; the strip at the bottom offers Undo for five seconds. */
var undoItem = null, undoTimer = null;
function deleteSpend(id){
  var s = allSpends().filter(function(x){ return x.id === id; })[0];
  if (!s) return;
  queueDelete(id);
  undoItem = s;
  clearTimeout(undoTimer);
  undoTimer = setTimeout(function(){ undoItem = null; renderUndo(); }, 5000);
  render();
}
function undoDelete(){
  var s = undoItem;
  if (!s) return;
  undoItem = null;
  clearTimeout(undoTimer);
  /* If the delete has not left the phone, drop it; otherwise put the spend back,
     under the name of whoever logged it. */
  var k = -1;
  OUTBOX.forEach(function(op, i){ if (op.op === 'del' && op.id === s.id) k = i; });
  if (k > -1 && !(sending && k === 0)){ OUTBOX.splice(k, 1); saveOutbox(); }
  else queueSpend({ id:s.id, d:s.d, cat:s.cat, dir:s.dir, amt:s.amt, note:s.note }, s.by || null);
  render();
}

function andList(parts){
  if (parts.length < 2) return parts.join('');
  return parts.slice(0, -1).join(', ') + ' and ' + parts[parts.length - 1];
}

function monthLabel(key){
  var m = PLAN.months.filter(function(x){ return x.key === key; })[0];
  return m ? m.label : key;
}

function diffRows(){
  var out = [];
  PLAN.flex.forEach(function(f){
    if (S[f.id] !== BASE[f.id]) out.push([f.label, fmt(BASE[f.id]), fmt(S[f.id])]);
  });
  if (S.salary !== BASE.salary) out.push(['Net salary', fmt(BASE.salary), fmt(S.salary)]);
  if (S.gem !== BASE.gem) out.push(['Gemeente lands', monthLabel(BASE.gem), monthLabel(S.gem)]);
  if (S.sept) out.push(['Spent since', fmt(0), fmt(S.sept)]);
  (PLAN.extras||[]).forEach(function(e){
    if (S[e.id] !== BASE[e.id]) out.push([e.label, fmt(BASE[e.id]), fmt(S[e.id])]);
  });
  PLAN.subs.filter(function(s){ return !s.cancelled; }).forEach(function(s){
    var on = (S.subs||[]).indexOf(s.id) > -1;
    if (on !== (BASE.subs.indexOf(s.id) > -1)) out.push([s.name, on ? 'off' : 'kept', on ? 'kept' : 'off']);
  });
  if (!out.length) return '<p class="small">Nothing is different from the plan.</p>';
  return out.map(function(r){
    return '<div class="row"><span class="grow"><b>' + esc(r[0]) + '</b></span>' +
      '<span class="amt"><span class="quiet strike">' + esc(r[1]) + '</span> ' +
      '<span class="quiet" style="font-size:13px">→</span> ' + esc(r[2]) + '</span></div>';
  }).join('');
}

/* ─────────────────────────── render ─────────────────────────── */

var PAGES = [['today','Today'],['forecast','Forecast'],['tasks','Tasks']];
var SCREENS = ['today','forecast','month','subs','debts','tasks','spends','bank','payments'];
var cameFrom = 'today';

function go(p, pushState){
  if (SCREENS.indexOf(p) === -1) p = 'today';
  if (p === 'subs') cameFrom = (page === 'month') ? 'month' : 'forecast';
  /* Leaving the payments marks what was on it as seen; arriving from Today clears a
     drill-down left over from Month. */
  if (page === 'payments' && p !== 'payments') markSeen();
  if (p !== 'payments') payFilter.m = null;
  if (p !== 'bank' && page === 'bank') bankMsg = '';
  if (page !== p) SFX.chatter();
  page = p;
  SCREENS.forEach(function(id){ $('s-' + id).hidden = id !== p; });
  if (pushState && location.hash !== '#' + p) history.pushState(null, '', '#' + p);
  window.scrollTo(0,0);
  render();
}

function renderLive(){
  var box = $('livebar');
  if (!box) return;
  if (!changed()){ box.innerHTML = ''; return; }
  var who = REMOTE.by && REMOTE.by !== ME ? esc(REMOTE.by) + ' changed the plan'
          : (REMOTE.by === ME && ME ? 'You changed the plan' : 'The plan was changed');
  var when = dirty ? 'saving…' : ago(REMOTE.updated);
  box.innerHTML = '<div class="live"><span class="who"><i></i><span>' + who +
    (when ? ' · ' + when : '') + '</span></span>' +
    '<button data-sheet="changed">See what ›</button></div>';
}

function render(){
  if (!PLAN) return;
  renderLive();

  $('tabs').hidden = false;
  $('tabs').firstElementChild.innerHTML = PAGES.map(function(p){
    var here = ['month','debts','spends','bank','payments'].indexOf(page) > -1 ? 'today' : (page === 'subs' ? cameFrom : page);
    return '<button data-go="' + p[0] + '" aria-current="' + (here === p[0] ? 'page' : 'false') + '">' +
      p[1] + '<em></em></button>';
  }).join('');

  var cur = model(S), base = model(BASE);
  var lastLabel = PLAN.months[PLAN.months.length-1].label;

  /* Today */
  var now = new Date();
  SFX.paint();

var FORECAST_SPEND_RULE = 'Spending more than that lowers these figures. Spending less does not raise them ' +
  'until it shows up in the bank.';

/* ─────────────────────────── the decision card ───────────────────────────
   When a month still ends below zero, Today opens with it and two ready fixes, each
   worked out by running the forecast until no month is short: spend less on the
   everyday budgets, or pause subscriptions (those the plan marks pause:false, card
   fees, never), topped up with an everyday cut when pausing is not enough. */

function shortOf(st){
  var M = model(st).M, worst = null;
  M.forEach(function(m){ if (m.bal < 0 && (!worst || m.bal < worst.bal)) worst = m; });
  return worst ? { by: cents(-worst.bal), month: worst } : null;
}
/* Takes a step off the biggest everyday budget, round by round, until nothing is short. */
function cutEveryday(st){
  var flex = PLAN.flex.slice().sort(function(a, b){ return (Number(st[b.id])||0) - (Number(st[a.id])||0); });
  for (var guard = 0; guard < 200 && shortOf(st); ){
    var moved = false;
    for (var i = 0; i < flex.length && shortOf(st); i++){
      var f = flex[i], v = Number(st[f.id]) || 0;
      if (v - f.step >= f.min){ st[f.id] = v - f.step; moved = true; guard++; }
    }
    if (!moved) break;
  }
  return st;
}
function fixes(){
  var now = shortOf(S);
  if (!now) return null;
  var a = cutEveryday(Object.assign({}, S));
  var b = Object.assign({}, S, { subs: (S.subs || []).slice() }), paused = [];
  keptSubs(S).filter(function(s){ return s.pause !== false; })
    .sort(function(x, y){ return y.amount - x.amount; })
    .forEach(function(s){
      if (!shortOf(b)) return;
      b.subs = b.subs.filter(function(id){ return id !== s.id; });
      paused.push(s);
    });
  if (shortOf(b)) b = cutEveryday(b);
  return { now: now, a: a, aLeft: shortOf(a), b: paused.length ? b : null, bLeft: paused.length ? shortOf(b) : null, paused: paused };
}
/* A note from the owner sits on top of the card. One about the shortfall (the
   default) leaves with it; always:true keeps it until it is read. */
function noticeOpen(short){
  var n = PLAN.notice;
  if (!n || !n.id || !n.body || store.get('runway-notice') === n.id) return null;
  return short || n.always ? n : null;
}
function actHtml(){
  var fx = fixes(), n = noticeOpen(!!fx);
  if (!fx && !n) return '';
  var html = '<p class="eyebrow">' + (fx ? 'Needs a decision' : 'A note') + '</p>';
  if (n) html += '<p class="note"><span class="by">From ' + esc(n.from || PLAN.people.other) + '</span>' + esc(n.body) + '</p>' +
    (fx ? '' : '<button class="ok" data-fix="notice">Got it</button>');
  if (fx){
    var m = fx.now.month, br = m.bridged;
    html += '<h3>' + esc(m.label) + ' is ' + esc(fmt(fx.now.by)) + ' short</h3>' +
      '<p class="deck">' + (br ? 'even with ' + esc(PLAN.bridge.by) + '’s ' + esc(fmt(br)) + '. ' : '') +
      (fx.aLeft && (!fx.b || fx.bLeft) ? 'Nothing below closes all of it; each gets closer.' : 'Either of these closes it:') + '</p>';
    var cut = cents(flexTotal(S) - flexTotal(fx.a));
    html += optHtml('a', 'Spend ' + fmt(cut) + ' less a month',
      PLAN.flex.map(function(f){ return f.label + ' ' + fmt(fx.a[f.id]); }).join(' · ') +
      ' (now ' + fmt(flexTotal(S)) + ')', fx.aLeft);
    if (fx.b){
      var subsCut = sum(fx.paused), extra = cents(flexTotal(S) - flexTotal(fx.b));
      html += optHtml('b', 'Pause ' + inWords(fx.paused.length) + (fx.paused.length === 1 ? ' subscription' : ' subscriptions') +
        (extra ? ', spend ' + fmt(extra) + ' less' : ''),
        fx.paused.map(function(s){ return s.name; }).join(', ') + ' · ' + fmt(subsCut) + ' a month', fx.bLeft);
    }
    html += '<button class="link" data-sheet="adjust"><span>Make my own mix</span><span class="n">›</span></button>';
    if (n) html += '<button class="ok" data-fix="notice">Hide the note</button>';
  }
  return html + alertsLine();
}
function optHtml(k, title, sub, left){
  return '<div class="row"><span class="grow"><b>' + esc(title) + '</b><span class="sub">' + esc(sub) +
    (left ? ' · still ' + esc(fmt(left.by)) + ' short' : '') + '</span></span>' +
    '<button class="pill" data-fix="' + k + '">Use this</button></div>';
}
function useFix(k){
  var fx = fixes();
  if (!fx) return;
  var st = k === 'a' ? fx.a : fx.b;
  if (!st) return;
  var tasks = S.tasks;
  S = Object.assign({}, st, { tasks: tasks });
  push();
  render();
}

/* ── alerts: Web Push, so a note from the owner reaches the phone ── */

var isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function standalone(){ return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
function pushOk(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
var alerts = 'none', alertErr = false;
function withTimeout(p, ms){ return Promise.race([p, new Promise(function(_, no){ setTimeout(function(){ no(new Error('timeout')); }, ms); })]); }
async function checkAlerts(){
  if (!pushOk()) alerts = isIos && !standalone() ? 'ios' : 'none';
  else if (Notification.permission === 'denied') alerts = 'denied';
  else {
    try {
      var reg = await withTimeout(navigator.serviceWorker.ready, 4000);
      alerts = (await reg.pushManager.getSubscription()) ? 'on' : 'off';
    } catch(e){ alerts = 'none'; }
  }
  render();
}
async function alertsOn(){
  alertErr = false;
  try {
    var perm = await Notification.requestPermission();
    if (perm === 'granted'){
      var reg = await withTimeout(navigator.serviceWorker.ready, 4000);
      var key = (await (await fetch(API + '/api/vapid')).json()).key;
      var bytes = Uint8Array.from(atob(key.replace(/-/g, '+').replace(/_/g, '/')), function(c){ return c.charCodeAt(0); });
      var sub = (await reg.pushManager.getSubscription()) ||
        await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: bytes });
      var res = await fetch(API + '/api/push/' + CODE, {
        method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ by: ME || null, sub: sub.toJSON() })
      });
      if (!res.ok) throw new Error('subscribe ' + res.status);
    }
  } catch(e){ alertErr = true; }
  await checkAlerts();
}
function alertsLine(){
  if (alertErr) return '<p class="status warn">Alerts did not turn on. Try again in a moment.</p>';
  if (alerts === 'off') return '<div class="row"><span class="grow"><b>Get alerts</b><span class="sub">A message on this phone when ' +
    esc(PLAN.people.other) + ' changes something</span></span><button class="pill" data-fix="alerts">Turn on</button></div>';
  if (alerts === 'ios') return '<p class="small" style="padding:10px 0">For alerts on this iPhone: Share › Add to Home Screen, then open Runway from there.' +
    ' If it asks for a code: <b>' + esc(CODE) + '</b></p>';
  return '';
}

/* The Home Screen app starts at the link it was added from, code and name included:
   on an iPhone its storage is not Safari's, so it cannot look the code up. */
function setManifest(){
  if (!CODE) return;
  var base = location.origin + location.pathname.replace(/[^/]*$/, '');
  var m = { name:'Runway', short_name:'Runway', display:'standalone', background_color:'#021006', theme_color:'#021006',
    scope: base, id: base, start_url: base + '?c=' + CODE + (ME ? '&me=' + encodeURIComponent(ME) : ''),
    icons: [{ src: base + 'icon-192.png', sizes:'192x192', type:'image/png' },
            { src: base + 'icon-512.png', sizes:'512x512', type:'image/png', purpose:'any maskable' }] };
  $('manifest').href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type:'application/manifest+json' }));
}

var WORDS = ['no','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve',
  'thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
function inWords(n){ return n <= 20 ? WORDS[n] : String(n); }

/* The figure, then the sentence that says what it is. */
function heroHtml(e){
  if (e.pockets && e.index > 0) return pocketHeroHtml(e);
  var over = e.left < 0;
  var fig = fmtAmt(Math.abs(e.left));
  var days = e.daysLeft > 0
    ? 'with <b>' + inWords(e.daysLeft) + (e.daysLeft === 1 ? ' day' : ' days') + '</b> to go'
    : 'and the month is over';
  var pace = paceOf(e);
  /* Until something is spent the pace only repeats the allowance, so it waits. */
  var paceCell = e.spent > 0
    ? '<div><span class="v ' + (pace >= 0 ? 'good' : 'over') + '">' + esc(fmtAmt(Math.abs(pace))) + '</span>' +
        '<span class="k">' + (pace >= 0 ? 'less than planned so far' : 'more than planned so far') + '</span></div>'
    : '<div><span class="v">' + esc(fmtAmt(e.spent)) + '</span><span class="k">spent so far</span></div>';
  return '<p class="eyebrow ink">Everyday spending · ' + esc(e.label) + '</p>' +
    '<p class="fig-xl' + (fig.length > 6 ? ' long' : '') + (over ? ' over' : '') + '" style="margin-top:10px">' + esc(fig) + '</p>' +
    '<p class="deck">' + (over ? 'over the budget' : 'left to spend') + ' on ' + esc(flexWords()) + ', ' + days + '.</p>' +
    '<div class="stats">' +
      '<div><span class="v">' + (e.perDay !== null ? esc(fmtAmt(cents(e.perDay))) : '—') + '</span>' +
        '<span class="k">a day you can spend</span></div>' +
      paceCell +
    '</div>' + statusHtml();
}
/* With the pockets linked the figure is what they hold, not a sum worked out. */
function pocketHeroHtml(e){
  var left = e.pocketLeft, over = left < 0, fig = fmtAmt(Math.abs(left));
  var days = e.daysLeft > 0
    ? 'with <b>' + inWords(e.daysLeft) + (e.daysLeft === 1 ? ' day' : ' days') + '</b> to go'
    : 'and the month is over';
  var all = e.pockets === e.cats.length;
  var fromPockets = cents(e.cats.reduce(function(t, c){ return t + (c.card || 0); }, 0));
  return '<p class="eyebrow ink">Everyday spending · ' + esc(e.label) + '</p>' +
    '<p class="fig-xl' + (fig.length > 6 ? ' long' : '') + (over ? ' over' : '') + '" style="margin-top:10px">' + esc(fig) + '</p>' +
    '<p class="deck">' + (over ? 'short ' : 'left ') + (all ? 'in your ' + esc(andList(PLAN.flex.map(function(f){ return f.label; }))) + ' pockets' : 'for ' + esc(flexWords())) +
      ', ' + days + '.</p>' +
    '<div class="stats">' +
      '<div><span class="v">' + (left > 0 && e.daysLeft > 0 ? esc(fmtAmt(cents(left / e.daysLeft))) : '—') + '</span>' +
        '<span class="k">a day you can spend</span></div>' +
      '<div><span class="v">' + esc(fmtAmt(fromPockets)) + '</span><span class="k">paid from the pockets this month</span></div>' +
    '</div>' +
    (e.outside > 0 ? '<p class="status warn">' + esc(fmtAmt(e.outside)) + ' went on everyday things from the main account, not a pocket.</p>' : '') +
    statusHtml();
}

function shortDate(d){

}
function dayLabel(d){
  var t = todayStr();
  if (d === t) return 'Today';
  if (d === addDays(t, -1)) return 'Yesterday';
  var p = ymdParts(d);
  return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
}

function spendsHeroHtml(e){

/* This month in four buckets: what the plan expects against what the bank shows. */
function monthBucketsHtml(ci){
  if (!hasBank() || !inRange(ci)) return '';
  var list = bankIn(ci), key = PLAN.months[ci].key, e = envelope(ci);
  var oneOffPlan = (PLAN.oneOffs || []).filter(function(o){ return o.month === key && o.amount < 0; })
    .reduce(function(t, o){ return t - o.amount; }, 0) + (S.gem === key ? PLAN.gemeente.amount : 0);
  var rows = [
    ['everyday', e.index === 0 ? e.budget : flexTotal(S), cents(e.bank + e.logged), 'cash included'],
    ['bills', sum(PLAN.fixed) + sum(keptSubs(S)), bucketSum(list, 'bills'), ''],
    ['debt', sum(PLAN.loans), bucketSum(list, 'debt'), ''],
    ['oneoff', oneOffPlan, bucketSum(list, 'oneoff'), '']
  ];
  return '<p class="eyebrow ink">' + esc(PLAN.months[ci].label) + ' so far</p>' +

          (r[1] ? '<u style="left:' + Math.min(100, mark).toFixed(1) + '%"></u>' : '') + '</span></button>';
    }).join('') + '</div>' + sortLine(list);

function sortLine(list){

function visiblePayments(){
  var f = payFilter, q = normText(f.q).join(' ');
  var conn = f.k === 'all' ? null : (BANK.conns || []).filter(function(c){ return c.id === f.k; })[0];
  var keys = conn ? (conn.accounts || []).map(function(a){ return a.k; }) : null;
  return classified().filter(function(c){
    if (f.m !== null && !(monthIndexOf(c.t.d) === f.m && (f.m > 0 || c.t.d >= PLAN.asOf))) return false;
    if (f.b !== 'all' && c.b !== f.b) return false;
    if (keys && keys.indexOf(c.t.k) === -1) return false;
    if (q && normText(c.t.who + ' ' + (c.t.desc || '')).join(' ').indexOf(q) === -1) return false;
    return true;
  });
}

function paymentRowsHtml(){
  if (!hasBank()) return '';
  var all = visiblePayments();
  var shown = all.filter(function(c){ return payFilter.hidden || !c.hidden; });
  var hidden = all.length - all.filter(function(c){ return !c.hidden; }).length;
  $('p-count').textContent = shown.length + (shown.length === 1 ? ' payment' : ' payments');
  if (!shown.length) return '<p class="deck" style="padding:18px 0">' + (all.length ? 'Only hidden payments here.' : 'Nothing here.') + '</p>' + hiddenLine(hidden);
  var html = '', day = null, total = 0;
  shown.forEach(function(c){ if (c.counts) total += c.out; });
  if (payFilter.b !== 'all' && payFilter.b !== 'in') html += '<p class="small" style="padding-top:12px">' + esc(fmt(total, true)) + ' counted in these</p>';
  shown.slice(0, 400).forEach(function(c){
    if (c.t.d !== day){ day = c.t.d; html += '<p class="eyebrow dayhead">' + esc(dayLabel(day)) + '</p>'; }
    html += paymentRowHtml(c);
  });
  if (shown.length > 400) html += '<p class="small" style="padding:12px 0">The newest 400 shown. Search or filter to find older ones.</p>';
  return html + hiddenLine(hidden);
}
function hiddenLine(n){
  if (!n) return '';
  return '<button class="link" data-act="toggle-hidden"><span>' + (payFilter.hidden ? 'Hide the hidden again' : n + ' hidden') + '</span>' +
    '<span class="n">' + (payFilter.hidden ? '' : 'show ›') + '</span></button>';
}
/* Who did what, for the other person to see: "moved by Ada", "flagged by Ada". */
function byOther(x){ return x && x.by && x.by !== ME ? x.by : null; }
function paymentSub(c){
  var bits = [c.own ? 'Between your accounts' : bucketLabel(c.b)];
  var acct = accountOf(c.t.k);
  if (acct && BANK.conns.length > 1) bits.push(bankShort(acct.bank));
  if (!c.own && c.tag.ns) bits.push('not spending');
  if (c.hidden) bits.push('hidden');
  if (c.src === 'tag' && byOther(c.tag)) bits.push('moved by ' + c.tag.by);
  else if (c.src === 'payee' && byOther(c.rule)) bits.push('always, set by ' + c.rule.by);
  return bits.join(' · ');
}
function paymentRowHtml(c){
  var t = c.t, credit = t.amt > 0;
  return '<button class="row' + (c.counts ? '' : ' ns') + (c.hidden ? ' off' : '') + '" data-pay="' + esc(t.id) + '">' +
    '<span class="grow"><span class="who">' + (isNew(c) ? '<span class="newdot" aria-label="new"></span>' : '') +
      '<b>' + esc(t.who || t.desc || 'Payment') + '</b></span>' +
      '<span class="sub">' + esc(paymentSub(c)) + '</span></span>' +
    (c.flag ? '<span class="chip q">' + (byOther(c.tag) ? 'flagged by ' + esc(c.tag.by) : 'flagged') + '</span>' : '') +
    '<span class="amt' + (credit ? ' good' : '') + '">' + (credit ? '+' : '') + esc(fmtAmt(Math.abs(t.amt))) + '</span></button>';

function spendRowsHtml(e){

  if (!list.length) return '<p class="deck" style="padding:12px 0">Nothing entered this month yet.</p>';
