<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Runway</title>
<meta name="description" content="What is left, what is coming, and what to do next.">
<meta name="theme-color" content="#07130c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Runway">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" id="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap">
<style>
/* MU-TH-UR 6000: phosphor on a CRT, always dark, in a soft green with a low glow. The ledger's rules below
   still set the layout; the MU-TH-UR block at the end of this sheet re-sets
   type and surfaces. "--serif" is the terminal face (VT323) for figures and
   words, "--sans" the small mono that labels them. Alert is amber, never red. */
:root{
  --ground:#07130c; --ink:#a8e6a1; --ink-2:#98d192; --muted:#6e9a6b; --rule:#223524;
  --press:#0f2416; --green:#e2f7de; --over:#eeb868; --on-ink:#07130c;
  --glow:rgba(168,230,161,.3);
  --serif:"VT323",ui-monospace,Menlo,monospace;
  --sans:"Share Tech Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink);
  font:15px/1.45 var(--sans); -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);
}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}

.wrap{max-width:430px;margin:0 auto;padding:40px 24px calc(118px + env(safe-area-inset-bottom,0px))}
.screen[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){
  .screen:not([hidden]){animation:in .22s ease both}
  @keyframes in{from{opacity:.35}to{opacity:1}}
}

/* type */
.eyebrow{font:600 10px/1.3 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.eyebrow.ink{color:var(--ink)}
.dateline{font:italic 17px/1.3 var(--serif);color:var(--muted);margin-top:2px}
.lbl{font-size:13px;color:var(--muted)}
.small{font-size:13px;color:var(--muted);line-height:1.55}
.quiet{color:var(--muted)}
.strike{text-decoration:line-through}
.over{color:var(--over)}
.good{color:var(--green)}
.num{font-family:var(--serif);font-variant-numeric:tabular-nums lining-nums}
.fig{font:400 64px/1 var(--serif);letter-spacing:-.03em;font-variant-numeric:lining-nums}
.fig.sm{font-size:56px}
.fig-xl{font:400 108px/.95 var(--serif);letter-spacing:-.035em;font-variant-numeric:lining-nums;
  overflow-wrap:anywhere}
.fig-xl.long{font-size:84px}
.deck{font:400 24px/1.2 var(--serif);color:var(--muted);margin-top:8px;text-wrap:pretty}
.deck b{font-weight:400;color:var(--ink)}
.h1{font:400 56px/.95 var(--serif);letter-spacing:-.02em}
.h1 i{font-style:italic}

/* masthead */
.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.mast .word{font:600 10px var(--sans);letter-spacing:.24em}
.pill{min-height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--ink);
  font:500 14px var(--sans);white-space:nowrap;display:inline-flex;align-items:center}
.pill.solid{background:var(--ink);color:var(--on-ink)}
.back{min-height:44px;display:inline-flex;align-items:center;font:italic 19px var(--serif)}

/* sections: a rule, not a card */
.card{border-top:1px solid var(--ink);padding:14px 0 4px;margin-top:22px}
.card.tight{padding-top:0}
.card.bare{border-top:0;margin-top:0;padding-top:0}

/* two figures side by side */
.stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--ink);
  border-bottom:1px solid var(--rule);padding:12px 0;margin-top:18px}
.stats > div{display:flex;flex-direction:column;min-width:0}
.stats > div + div{padding-left:18px;border-left:1px solid var(--rule)}
.stats .v{font:400 34px/1.1 var(--serif);font-variant-numeric:lining-nums}
.stats .k{font-size:12px;color:var(--muted)}

/* rows */
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0;min-height:52px}
.row + .row{border-top:1px solid var(--rule)}
.row .grow{flex:1;min-width:0}
.row b{display:block;font:400 21px/1.2 var(--serif)}
.row .sub{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.row .amt{font:400 20px var(--serif);white-space:nowrap;font-variant-numeric:tabular-nums lining-nums}
.chev{color:var(--muted);font:italic 20px var(--serif);line-height:1}
button.row:hover b{font-style:italic}
.row.off b{color:var(--muted)}
.row.off .amt{color:var(--muted);text-decoration:line-through}

/* the ledger table */
.ledger{margin-top:14px}
.lg-h,.lg-r{display:grid;grid-template-columns:1.5fr repeat(3,minmax(0,1fr));align-items:baseline}
.lg-h{font:600 10px var(--sans);letter-spacing:.16em;color:var(--muted);padding-bottom:4px}
.lg-h span,.lg-r span{text-align:right}
.lg-h span:first-child,.lg-r span:first-child{text-align:left}
.lg-r{padding:9px 0;border-top:1px solid var(--rule);font:400 20px var(--serif);font-variant-numeric:tabular-nums lining-nums}
.lg-r span:first-child{font-size:21px}
.lg-r .b{color:var(--muted)}
.lg-r.total{border-top:3px double var(--ink)}
.lg-r.total span:first-child{font-style:italic}
.link{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:48px;
  border-top:1px solid var(--rule);font:italic 19px var(--serif)}
.link .n{font:13px var(--sans);font-style:normal;color:var(--muted)}

/* a month split into its parts */
.split{display:flex;gap:3px;height:8px;margin:18px 0 6px}
.split i{display:block;background:var(--ink)}

/* daily chart */
.daily{margin-top:18px}
.daily .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.daily svg{display:block;width:100%;overflow:visible}
.daily text{font-family:var(--sans)}

/* forecast bars */
.fc{margin-top:22px}
.fc-r{display:grid;grid-template-columns:44px 1fr 88px;align-items:center;min-height:32px;border-top:1px solid var(--rule)}
.fc-r:last-child{border-bottom:1px solid var(--ink)}
.fc-r .m{font:400 18px var(--serif)}
.fc-r .v{font:400 18px var(--serif);text-align:right;font-variant-numeric:tabular-nums lining-nums}
.fc-r.neg .m,.fc-r.neg .v{color:var(--over)}
.fc-r.neg .m{font-style:italic}
.fc-r .track{position:relative;height:10px;margin:0 10px}
.fc-r .track i{position:absolute;top:0;height:10px;background:var(--ink)}
.fc-r.neg .track i{background:var(--over)}
.fc-r .track u{position:absolute;top:-8px;bottom:-8px;width:1px;background:var(--rule)}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}
.notes div{display:flex;flex-direction:column;gap:4px}
.notes p{font:400 19px/1.25 var(--serif)}

/* the live line */
.live{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;
  border-bottom:1px solid var(--rule);margin:-8px 0 14px}
.live .who{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.live .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live i{display:block;width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
@media (prefers-reduced-motion:no-preference){
  .live i{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
}
.live button{font:italic 17px var(--serif);white-space:nowrap;min-height:44px}

/* chips */
.chip{border:1px solid var(--over);color:var(--over);border-radius:999px;
  padding:4px 10px;font-size:12px;font-weight:500;white-space:nowrap}

/* checkbox + toggle */
.cb{appearance:none;margin:0;flex:none;width:22px;height:22px;border-radius:3px;
  border:1.5px solid var(--ink);background:none;display:grid;place-items:center;cursor:pointer}
.row:has(> .cb){align-items:flex-start}
.row > .cb{margin-top:5px}
.cb:checked{background:var(--ink)}
.cb:checked::after{content:"";width:9px;height:5px;border-left:2px solid var(--on-ink);
  border-bottom:2px solid var(--on-ink);transform:translateY(-1px) rotate(-45deg)}
.sw{appearance:none;margin:0;flex:none;width:42px;height:25px;border-radius:999px;background:var(--rule);
  position:relative;cursor:pointer;transition:background .16s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;
  background:var(--ground);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .16s}
.sw:checked{background:var(--ink)}
.sw:checked::after{transform:translateX(17px)}

/* tabs: three words under a rule */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ground);
  display:flex;justify-content:center;padding:0 24px calc(18px + env(safe-area-inset-bottom,0px))}
.tabs .inner{display:flex;justify-content:space-between;width:100%;max-width:382px;border-top:1px solid var(--ink);padding-top:6px}
.tabs button{min-height:48px;min-width:72px;font:400 20px var(--serif);color:var(--muted)}
.tabs button:first-child{text-align:left}
.tabs button:last-child{text-align:right}
.tabs button[aria-current="page"]{color:var(--ink);font-style:italic}
.tabs em{display:none}

/* floating bar (subscriptions effect, undo) */
.float{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:25;
  width:min(382px,calc(100vw - 32px));
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--ink);color:var(--on-ink);border-radius:14px;padding:10px 10px 10px 18px;
  box-shadow:0 10px 28px -8px rgba(0,0,0,.35)}
.float .l1{font-size:12px;opacity:.7}
.float .l2{display:flex;align-items:baseline;gap:7px;margin-top:2px}
.float .was{font:400 15px var(--serif);opacity:.6;text-decoration:line-through}
.float .arrow{font-size:12px;opacity:.6}
.float .now{font:400 22px var(--serif)}
.float button{background:var(--on-ink);color:var(--ink);border-radius:999px;min-height:44px;
  padding:0 20px;font-size:14px;font-weight:500}
.float .undo-msg{font:400 18px var(--serif);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(21,20,18,.42);z-index:40;opacity:0;
  pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;transform:translateX(-50%) translateY(calc(100% + 60px));bottom:0;z-index:50;
  width:min(430px,100vw);background:var(--ground);
  border-radius:22px 22px 0 0;box-shadow:0 -10px 36px -8px rgba(0,0,0,.3);
  padding:10px 24px calc(24px + env(safe-area-inset-bottom,0px));
  max-height:94vh;overflow-y:auto;transition:transform .28s cubic-bezier(.2,.8,.3,1)}
.sheet.open{transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto 12px}
.sheet h2{font:400 34px/1.05 var(--serif);letter-spacing:-.01em}
.sheet .hint{font-size:13px;color:var(--muted);margin-top:4px}

/* sliders */
.slider{padding-top:18px}
.stop{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.stop label{font:400 20px var(--serif)}
.stop .vals{display:flex;align-items:baseline;gap:8px}
.stop .plan{font-size:12px;color:var(--muted)}
.stop output{font:400 22px var(--serif)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:none;margin:6px 0 0;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:2px;
  background:linear-gradient(to right,var(--ink) var(--p),var(--rule) var(--p))}
input[type=range]::-moz-range-track{height:2px;background:var(--rule)}
input[type=range]::-moz-range-progress{height:2px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;
  background:var(--ground);border:2px solid var(--ink);margin-top:-11px;cursor:grab}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--ground);
  border:2px solid var(--ink);cursor:grab}
.minmax{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}

/* result */
.result{border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:10px 0;margin-top:20px;display:grid;gap:6px}
.result .r{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.result .r .m{font-size:13px;color:var(--muted)}
.result .r .g{display:flex;align-items:baseline;gap:8px}
.result .was{font:400 16px var(--serif);color:var(--muted);text-decoration:line-through}
.result .arrow{font-size:12px;color:var(--muted)}
.result .now{font:400 22px var(--serif)}

.acts{display:flex;gap:10px;margin-top:16px}
.acts button{flex:1;border-radius:28px;min-height:52px;font-size:15px;font-weight:500;text-align:center}
.acts .ghost{border:1px solid var(--ink)}
.acts .solid{background:var(--ink);color:var(--on-ink)}

select{font:400 19px var(--serif);color:var(--ink);background:var(--ground);
  border:0;border-bottom:1px solid var(--ink);border-radius:0;padding:10px 0;width:100%;margin-top:8px}

.note{border-top:1px solid var(--rule);padding-top:10px}
.plist{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.plist li{font:400 18px/1.3 var(--serif);color:var(--ink-2)}
.plist li::before{content:"—  ";color:var(--muted)}
.foot{font-size:12px;color:var(--muted);line-height:1.7;margin-top:28px;padding-top:14px;border-top:1px solid var(--rule)}
details summary{list-style:none;cursor:pointer;font:italic 16px var(--serif);margin-top:6px;min-height:32px;display:flex;align-items:center}
details summary::-webkit-details-marker{display:none}
details p{font:400 17px/1.4 var(--serif);color:var(--ink-2);margin-top:4px}
.tel{text-decoration:underline;text-underline-offset:3px}
.quote{font:italic 26px/1.2 var(--serif);margin-top:10px}

/* spends */
.status{font-size:13px;color:var(--muted);margin-top:10px}
.status.warn{color:var(--over)}
.del{flex:none;width:44px;height:44px;margin-right:-12px;display:grid;place-items:center;
  color:var(--muted);font:400 26px var(--serif);line-height:1}
.del:hover{color:var(--over)}

/* the log sheet: a ruled entry with its own number pad */
.lg-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:44px}
.lg-head .cancel{justify-self:start;min-height:44px;font-size:15px;color:var(--muted)}
.lg-head .date{justify-self:end;font:italic 17px var(--serif);color:var(--muted)}
.lg-head h2{font:600 10px var(--sans);letter-spacing:.24em;text-transform:uppercase}
.lg-amt{display:flex;justify-content:center;border-bottom:1px solid var(--ink);padding:10px 0 6px}
.lg-amt input{width:100%;border:0;background:none;outline:none;text-align:center;color:var(--ink);
  font:400 92px/1 var(--serif);letter-spacing:-.03em;padding:0;caret-color:var(--green)}
.lg-amt input::placeholder{color:var(--rule)}
.lg-amt.in input{color:var(--green)}
.tabsel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:4px}
.tabsel.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tabsel button{min-height:48px;font:400 21px var(--serif);color:var(--muted)}
.tabsel button[aria-pressed="true"]{color:var(--ink);font-style:italic;
  text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:7px}
.tabsel.two button{font-size:17px;min-height:44px}
.memo{display:flex;align-items:baseline;gap:12px;padding:10px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.memo input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--ink);
  font:italic 20px var(--serif);padding:0}
.memo input::placeholder{color:var(--muted);opacity:.7}
.lg-hint{font-size:13px;color:var(--muted);padding:10px 0;min-height:40px;display:flex;align-items:center}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.pad button{min-height:54px;font:400 30px var(--serif);border-top:1px solid var(--rule)}
.pad button:nth-child(-n+3){border-top:0}
.pad button:not(:nth-child(3n+1)){border-left:1px solid var(--rule)}
.pad button:active{background:var(--press)}
.err{font-size:13px;color:var(--over);min-height:1px;margin-top:8px}
.enter{display:block;width:100%;min-height:54px;border-radius:28px;background:var(--ink);color:var(--on-ink);
  font-size:15px;font-weight:500;margin-top:12px}

/* the bank: payments, buckets, PIN */
.filters{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;margin-top:10px;
  border-bottom:1px solid var(--rule)}
.filters::-webkit-scrollbar{display:none}
.filters button{min-height:44px;font:400 18px var(--serif);color:var(--muted);white-space:nowrap;flex:none}
.filters button[aria-pressed="true"]{color:var(--ink);font-style:italic;
  text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:7px}
.search{display:flex;align-items:baseline;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--ink);font:italic 19px var(--serif);padding:4px 0}
.search input::placeholder{color:var(--muted);opacity:.7}
.dayhead{padding:18px 0 2px;border-bottom:1px solid var(--ink)}
.dayhead + .row{border-top:0}
.row .who{display:flex;align-items:center;gap:8px;min-width:0}
.row .who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.newdot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--green)}
.row.ns .amt{color:var(--muted)}
.chip.q{border-color:var(--rule);color:var(--muted)}
.bk{display:block;width:100%;text-align:left;padding:12px 0 10px}
.bk + .bk{border-top:1px solid var(--rule)}
.bk .top{display:flex;align-items:baseline;gap:12px}
.bk .top b{flex:1;font:400 21px/1.2 var(--serif)}
.bk .top .amt{font:400 20px var(--serif);white-space:nowrap}
.bk .of{font-size:12px;color:var(--muted);margin-top:2px}
.bk .track{position:relative;height:6px;margin-top:8px;background:var(--press)}
.bk .track i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.bk .track u{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--muted)}
.pay-amt{font:400 56px/1 var(--serif);letter-spacing:-.02em;margin-top:14px;font-variant-numeric:lining-nums}
.pay-desc{font:400 17px/1.4 var(--serif);color:var(--ink-2);margin-top:10px;overflow-wrap:anywhere}
.scope{display:grid;gap:8px;margin-top:10px}
.scope button{min-height:48px;border-radius:24px;border:1px solid var(--ink);font-size:14px;font-weight:500}
.pindots{display:flex;justify-content:center;gap:14px;padding:26px 0 22px}
.pindots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink)}
.pindots i.on{background:var(--ink)}
.textbtn{min-height:44px;font:italic 17px var(--serif);text-decoration:underline;text-underline-offset:4px}
.msg{font:400 19px/1.3 var(--serif);border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);padding:12px 0;margin-top:14px}

.boot{max-width:430px;margin:0 auto;padding:120px 24px;text-align:center}
.boot h1{font:400 64px/1 var(--serif);letter-spacing:-.02em}
.boot p{font:400 20px/1.3 var(--serif);color:var(--muted);margin-top:12px}
.boot input{font:400 24px var(--serif);letter-spacing:.14em;text-align:center;color:var(--ink);
  background:none;border:0;border-bottom:1px solid var(--ink);border-radius:0;
  padding:12px;width:100%;margin-top:26px}
.boot .solid{background:var(--ink);color:var(--on-ink);border-radius:28px;
  min-height:54px;font-size:15px;font-weight:500;width:100%;margin-top:16px}

/* ───────────── MU-TH-UR 6000 ─────────────
   Everything below re-sets the ledger for the terminal: VT323 sizes run
   larger than the serif's did, nothing is italic (a selection is inverse
   video instead), corners are square, and what you press is a beige key. */
body{text-shadow:0 0 6px var(--glow);letter-spacing:.02em}
body::after{content:"";position:fixed;inset:0;z-index:70;pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.28) 3px,transparent 4px);
  box-shadow:inset 0 0 120px rgba(0,0,0,.8)}
:focus-visible{outline:3px solid #6fd3ff;border-radius:0}
@media (prefers-reduced-motion:no-preference){
  body::after{animation:flick 6s infinite}
  @keyframes flick{0%,47%,53%,100%{opacity:1}50%{opacity:.7}}
  #t-hero .fig-xl::after{animation:blink 1s steps(2,start) infinite}
  @keyframes blink{to{visibility:hidden}}
}

.eyebrow{font:400 11px/1.3 var(--sans);letter-spacing:.18em}
.dateline{font:400 20px/1.2 var(--serif);text-transform:uppercase}
.lbl,.small,.status,.lg-hint,.err{font-family:var(--sans)}
.mast .word{font:400 12px var(--sans);letter-spacing:.12em}
.mast .word::before{content:"MU-TH-UR 6000 · "}
.pill{border-radius:0;border:2px solid var(--ink);font:400 12px var(--sans);letter-spacing:.14em;text-transform:uppercase}
.pill::before{content:"[\00a0"}
.pill::after{content:"\00a0]"}
.pill.solid{background:transparent;color:var(--ink)}
.pill:hover{background:var(--press)}
.back{font:400 23px var(--serif);text-transform:uppercase}
.h1{font:400 58px/.9 var(--serif);letter-spacing:0;text-transform:uppercase}
.h1::before{content:"> "}
.h1 i{font-style:normal}

.card{border-top:2px dashed var(--rule)}
.stats{border-top:2px dashed var(--rule)}
.fig{font:400 76px/.9 var(--serif);letter-spacing:0}
.fig.sm{font-size:64px}
.fig-xl{font:400 100px/.9 var(--serif);letter-spacing:0;white-space:nowrap;overflow-wrap:normal}
.fig-xl.long{font-size:80px}
#t-hero .fig-xl::after{content:"";display:inline-block;width:.28em;height:.62em;margin-left:.06em;background:currentColor}
.deck{font:400 26px/1.1 var(--serif)}
.stats .v{font:400 40px/1 var(--serif)}
.row b{font:400 25px/1.05 var(--serif)}
.row .amt{font:400 24px var(--serif)}
.chev{font:400 24px var(--serif);color:var(--ink)}
button.row:hover{background:var(--press)}
button.row:hover b{font-style:normal}
.lg-r{font:400 24px var(--serif)}
.lg-r span:first-child{font-size:24px}
.lg-r.total span:first-child{font-style:normal}
.link{font:400 24px var(--serif);text-transform:uppercase}
.split i{box-shadow:0 0 6px var(--glow)}

/* the forecast: months below zero are bridged, so dim and hatched, not alarmed */
.fc-r .m,.fc-r .v{font:400 22px var(--serif)}
.fc-r.neg .m,.fc-r.neg .v{color:var(--muted);font-style:normal}
.fc-r.neg .track i{background:repeating-linear-gradient(45deg,var(--muted) 0 3px,transparent 3px 6px)}
.notes p{font:400 23px/1.1 var(--serif)}

.live button{font:400 21px var(--serif);text-transform:uppercase}
.chip{border:0;border-radius:0;background:var(--over);color:var(--on-ink);text-shadow:none;
  font:400 12px var(--sans);letter-spacing:.1em;text-transform:uppercase}
.chip.q{background:transparent;border:1px solid var(--muted);color:var(--muted)}
.cb{border-radius:0;border-width:2px}
.sw,.sw::after{border-radius:0}
.sw::after{background:var(--muted);box-shadow:none}
.sw:checked::after{background:var(--on-ink)}

/* tabs: a beige key deck, the current key pressed with its lamp lit */
.tabs{background:#d8d3c4;border-top:3px solid #b3ad9c;box-shadow:inset 0 2px 0 #f2eee3;text-shadow:none;
  padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.tabs[hidden]{display:none}
.tabs .inner{border-top:0;padding-top:0;gap:12px;max-width:398px}
.tabs button,.tabs button:first-child,.tabs button:last-child{flex:1;min-width:0;min-height:56px;text-align:center;
  border-radius:7px;background:#e8e3d4;color:#1c1c1a;font:400 12px var(--sans);letter-spacing:.16em;text-transform:uppercase;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  box-shadow:0 4px 0 #9d978a,inset 0 2px 0 #fbf8ef}
.tabs em{display:block;order:-1;width:6px;height:6px;border-radius:50%;background:#8a8577}
.tabs button[aria-current="page"]{color:#1c1c1a;font-style:normal;transform:translateY(3px);
  box-shadow:0 1px 0 #9d978a,inset 0 2px 0 #fbf8ef}
.tabs button[aria-current="page"] em{background:#7fc27a;box-shadow:0 0 6px #a8e6a1}

.float{bottom:calc(100px + env(safe-area-inset-bottom,0px));background:#07130c;color:var(--ink);
  border:2px solid var(--ink);border-radius:0;box-shadow:0 0 22px rgba(168,230,161,.22)}
.float .was{font:400 18px var(--serif)}
.float .now{font:400 26px var(--serif)}
.float .undo-msg{font:400 22px var(--serif)}
.float button{background:var(--ink);color:var(--on-ink);border-radius:0;text-shadow:none;
  font:400 12px var(--sans);letter-spacing:.14em;text-transform:uppercase}

.scrim{background:rgba(0,0,0,.6)}
.sheet{background:#0a170f;border-top:2px solid var(--ink);border-radius:0;box-shadow:0 -10px 40px rgba(168,230,161,.12)}
.grab{background:var(--muted);border-radius:0}
.sheet h2{font:400 40px/1 var(--serif);text-transform:uppercase}
.stop label{font:400 24px var(--serif)}
.stop output{font:400 26px var(--serif)}
input[type=range]::-webkit-slider-thumb{border-radius:0}
input[type=range]::-moz-range-thumb{border-radius:0}
.result{border-top:2px dashed var(--rule);border-bottom:2px dashed var(--rule)}
.result .was{font:400 19px var(--serif)}
.result .now{font:400 26px var(--serif)}
.acts button{border-radius:0;font:400 12px var(--sans);letter-spacing:.14em;text-transform:uppercase}
.acts .ghost{border:2px solid var(--ink)}
.acts .solid{text-shadow:none}
select{font:400 22px var(--serif)}
.snd{font:400 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);min-height:32px;padding:0}
#hum{margin-left:14px}
.ty-rest{visibility:hidden}
.ty-cur{display:inline-block;width:.55em;height:.9em;margin-right:-.55em;vertical-align:-.08em;background:currentColor}
.snd[aria-pressed="true"]{color:var(--ink)}
.snd::before{content:"■ "}
.snd[aria-pressed="false"]::before{content:"□ "}
.pocket{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 0 12px}
.pocket select{width:auto;min-width:150px;margin:0}
.plist li{font:400 22px/1.15 var(--serif)}

/* the decision card: amber, the one thing on Today that asks for something */
.act{border:2px solid var(--over);padding:14px 14px 4px;margin-top:18px;color:var(--over);text-shadow:0 0 6px rgba(255,179,71,.4)}
.act[hidden]{display:none}
.act .eyebrow{color:var(--over)}
.act .eyebrow::before{content:"▲ "}
.act h3{font:400 40px/1 var(--serif);text-transform:uppercase;margin-top:6px;overflow-wrap:anywhere}
.act .deck{font-size:22px;color:var(--ink);margin-top:4px}
.act .note{font:400 22px/1.15 var(--serif);color:var(--ink);border-left:3px solid var(--over);padding:2px 0 2px 10px;margin:10px 0 4px}
.act .note .by{display:block;font:400 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--over);margin-bottom:4px}
.act .row{border-top:1px dashed var(--rule)}
.act .row b{color:var(--ink)}
.act .row .pill{flex:none;min-height:40px;padding:0 10px}
.act .ok{font:400 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--over);min-height:40px}
.act .link{color:var(--ink)}
details summary{font:400 20px var(--serif);text-transform:uppercase}
details p{font:400 21px/1.2 var(--serif)}
.quote{font:400 30px/1.1 var(--serif);text-transform:uppercase}
.del{font:400 30px var(--serif)}

/* the log sheet: the figure on the screen, the number pad as keys */
.lg-head .cancel{font-family:var(--sans);text-transform:uppercase;letter-spacing:.1em}
.lg-head .date{font:400 20px var(--serif);text-transform:uppercase}
.lg-head h2{font:400 12px var(--sans)}
.lg-amt{border-bottom:2px dashed var(--rule)}
.lg-amt input{font:400 104px/1 var(--serif);letter-spacing:0;text-shadow:0 0 8px var(--glow)}
.tabsel button{font:400 24px var(--serif);text-transform:uppercase}
.tabsel.two button{font-size:21px}
.tabsel button[aria-pressed="true"],.filters button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);
  font-style:normal;text-decoration:none;text-shadow:none}
.memo{border-top:2px dashed var(--rule);border-bottom:2px dashed var(--rule)}
.memo input{font:400 23px var(--serif)}
.pad{border:0;gap:10px;padding:12px 0}
.pad button,.pad button:nth-child(-n+3),.pad button:not(:nth-child(3n+1)){border:0;border-radius:7px;
  background:#e8e3d4;color:#1c1c1a;text-shadow:none;font:400 24px var(--sans);
  box-shadow:0 4px 0 #9d978a,inset 0 2px 0 #fbf8ef}
.pad button:active{background:#e8e3d4;transform:translateY(3px);box-shadow:0 1px 0 #9d978a,inset 0 2px 0 #fbf8ef}
.enter{border-radius:8px;background:#1c1c1a;color:var(--ink);border:2px solid var(--ink);
  font:400 14px var(--sans);letter-spacing:.3em;text-transform:uppercase}

/* the bank */
.filters{border-bottom:2px dashed var(--rule)}
.filters button{font:400 21px var(--serif);text-transform:uppercase;padding:0 6px}
.search{border-bottom:2px dashed var(--rule)}
.search input{font:400 22px var(--serif)}
.dayhead{border-bottom:2px dashed var(--rule)}
.bk .top b{font:400 25px/1.05 var(--serif)}
.bk .top .amt{font:400 24px var(--serif)}
.pay-amt{font:400 76px/1 var(--serif);letter-spacing:0}
.pay-desc{font:400 21px/1.2 var(--serif)}
.scope button{border-radius:0;border:2px solid var(--ink);font:400 12px var(--sans);letter-spacing:.12em;text-transform:uppercase}
.pindots i{border-radius:0;border-width:2px}
.textbtn{font:400 21px var(--serif);text-transform:uppercase}
.msg{font:400 23px/1.15 var(--serif);border-top:2px dashed var(--rule)}

.boot h1{font:400 76px/1 var(--serif);text-transform:uppercase}
.boot h1::before{content:"MU-TH-UR 6000";display:block;font:400 13px var(--sans);letter-spacing:.2em;margin-bottom:10px}
.boot p{font:400 24px/1.15 var(--serif)}
.boot input{font:400 30px var(--serif)}
.boot .solid{border-radius:0;text-shadow:none;font:400 13px var(--sans);letter-spacing:.2em;text-transform:uppercase}

/* ───────────── Organised ─────────────
   Every screen reads the same way: one figure on top with a line under it, rows in
   groups with their subtotal, a dotted leader between a name and its value, amber
   only when something needs doing, and the rest behind a › or a sheet. */
.o-top{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px;margin-bottom:14px}
.o-top > span:last-child{display:flex;gap:14px;white-space:nowrap}
.o-top #hum{margin-left:0}
.o-eb{font:400 13px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.o-big{font:400 96px/.86 var(--serif);margin-top:6px;white-space:nowrap;text-transform:uppercase}
.o-big.long{font-size:72px}
.o-big.over{color:var(--over)}
.o-line{font:400 24px/1.1 var(--serif);color:var(--muted);margin-top:6px;text-transform:uppercase}
.o-key{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border:2px solid var(--ink);border-radius:0;
  background:none;color:var(--ink);font:400 22px var(--serif);text-transform:uppercase;text-decoration:none}
.o-key:active{background:var(--ink);color:var(--ground);text-shadow:none}
.o-entry{position:sticky;bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:5;width:100%;margin-top:24px;
  background:var(--ground);font-size:26px;letter-spacing:.06em}
.o-amb{display:flex;align-items:baseline;gap:8px;width:100%;min-height:44px;margin-top:14px;padding:8px 10px 6px;border:2px solid var(--over);
  border-radius:0;background:none;color:var(--over);font:400 24px/1.1 var(--serif);text-align:left;text-transform:uppercase;
  text-shadow:0 0 7px rgba(238,184,104,.3)}
.o-amb .lead{flex-grow:1;min-width:12px;border-bottom:2px dotted rgba(238,184,104,.35);transform:translateY(-7px)}
.o-grp{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:20px 0 3px;border-bottom:2px dashed var(--rule);
  font:400 13px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.o-row{position:relative;display:flex;align-items:baseline;gap:8px;width:100%;min-height:44px;padding:8px 0 4px;border:0;border-radius:0;
  background:none;color:inherit;font:400 24px/1.1 var(--serif);text-align:left;text-transform:uppercase;text-decoration:none}
.o-row .lead{flex-grow:1;min-width:12px;border-bottom:2px dotted var(--rule);transform:translateY(-7px)}
.o-row .v{white-space:nowrap}
.o-row.dim,.o-row .dim{color:var(--muted)}
.o-row.over,.o-row .over{color:var(--over)}
.o-row .good{color:var(--green)}
.o-row .new{font:400 12px var(--sans);letter-spacing:.14em;color:var(--over)}
.o-two{flex-direction:column;align-items:stretch;gap:0}
.o-two .top{display:flex;align-items:baseline;gap:8px}
.o-sm{display:block;font:400 13px/1.3 var(--sans);letter-spacing:.06em;color:var(--muted);padding-top:3px;text-transform:uppercase}
.o-box{display:inline-block;width:14px;height:14px;border:2px solid currentColor;flex-shrink:0;transform:translateY(1px)}
.o-box.on{background:currentColor}
.o-row input.sw{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.o-row input.sw:focus-visible + .top,.o-row input.sw:focus-visible ~ .o-box{outline:3px solid #6fd3ff}
.o-bar{height:10px;margin-top:12px;border:1px solid var(--rule)}
.o-bar i{display:block;height:100%;background:var(--ink)}
.o-split{display:flex;gap:3px;height:14px;margin-top:14px}
.o-split i{display:block;background:var(--ink)}
.o-note{font:400 22px/1.2 var(--serif);margin:10px 0 4px}
.o-foot{font:400 12px/1.5 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:14px}
.o-chips{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 6px}
.o-chips .o-key{min-height:40px;font-size:20px;padding:0 12px}
.o-chips .o-key[aria-pressed="true"]{background:var(--ink);color:var(--ground);text-shadow:none}
.o-task{padding:0;align-items:center}
.o-tick{display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;margin-left:-14px;border:0;background:none;color:inherit}
.o-open{display:flex;align-items:baseline;gap:8px;flex-grow:1;min-width:0;min-height:44px;padding:8px 0 4px;border:0;background:none;color:inherit;
  font:400 24px/1.1 var(--serif);text-align:left;text-transform:uppercase}
.o-task.done{color:var(--muted)}
.o-task.done .o-open > span:first-child{text-decoration:line-through}
.o-row .del{align-self:center}
#b-sync .o-key{font-size:20px}
.o-row:focus-visible,.o-key:focus-visible,.o-amb:focus-visible,.o-tick:focus-visible,.o-open:focus-visible{outline:3px solid #6fd3ff;outline-offset:2px}

/* MOTHER: one asks on the terminal, the other answers, the answer types out */
.mo-l{font:400 26px/1.1 var(--serif);text-transform:uppercase}
.mo-l.dim{color:var(--muted)}
.mo-cur{display:inline-block;width:.55em;height:.9em;margin-left:.15em;vertical-align:-.08em;background:currentColor;animation:mo-blink 1.06s steps(1) infinite}
@keyframes mo-blink{50%{opacity:0}}
.mo-q{display:block;width:100%;padding:12px 0 8px;border:0;border-bottom:2px dashed var(--rule);border-radius:0;background:none;color:inherit;text-align:left}
.mo-q > span{display:block}
.mo-q .who{font:400 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mo-q .new{display:inline;margin-left:8px;color:var(--over)}
.mo-q .q{font:400 24px/1.12 var(--serif);text-transform:uppercase;margin-top:4px;overflow-wrap:anywhere;white-space:pre-line}
.mo-q .a{font:400 24px/1.12 var(--serif);text-transform:uppercase;margin-top:6px;padding-left:12px;border-left:3px solid var(--ink);overflow-wrap:anywhere;white-space:pre-line}
.mo-q .w{font:400 20px/1.1 var(--serif);text-transform:uppercase;margin-top:6px;color:var(--over)}
.mo-ta{display:block;width:100%;min-height:128px;margin-top:10px;padding:10px;border:2px solid var(--ink);border-radius:0;background:#04100a;color:var(--ink);
  font:400 24px/1.15 var(--serif);text-transform:uppercase;resize:vertical}
.mo-ta::placeholder{color:var(--muted)}
.mo-ta:focus{outline:3px solid #6fd3ff;outline-offset:2px}
.tabs em.call,.tabs button[aria-current="page"] em.call{background:#eeb868;box-shadow:0 0 6px #eeb868}
.mo-play{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;overflow-y:auto;background:#020a05;color:var(--ink);
  padding:calc(28px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));text-shadow:0 0 6px rgba(168,230,161,.35)}
.mo-play[hidden]{display:none}
.mo-scr{font:400 28px/1.15 var(--serif);text-transform:uppercase;white-space:pre-wrap;overflow-wrap:anywhere}
.mo-scr .dim{color:var(--muted)}
.mo-scr .ans{display:block;margin-top:6px;padding-left:12px;border-left:3px solid var(--ink)}
.mo-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;max-width:420px;margin:16px 0}
.mo-grid[hidden]{display:none}
.mo-grid i{display:block;aspect-ratio:1;background:var(--ink);opacity:.08}
.mo-grid i.on{opacity:.9;box-shadow:0 0 6px var(--ink)}
.mo-go{flex:none;width:100%;min-height:56px;margin-top:auto}
.mo-go[hidden]{display:none}
.mo-scr + .mo-grid + .mo-go{margin-top:auto}
</style>
</head>
<body>

<div id="boot" class="boot" hidden>
  <h1>Runway</h1>
  <p id="boot-msg">Open the link you were sent, or type the code from it.</p>
  <input id="boot-code" inputmode="latin" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="code" aria-label="Code">
  <button class="solid" id="boot-go">Open</button>
</div>

<div class="wrap" id="app" hidden>
  <div id="livebar"></div>

  <section class="screen" id="s-today" hidden>
    <div class="o-top">
      <span class="o-eb" id="t-date"></span>
      <span><button class="snd" id="snd" type="button" aria-pressed="true">Sound on</button><button class="snd" id="hum" type="button" aria-pressed="false">Hum off</button></span>
    </div>
    <div id="t-hero"></div>
    <div id="t-act"></div>
    <div id="t-cats"></div>
    <div id="t-bank"></div>
    <div id="t-nav"></div>
    <button class="o-key o-entry" id="t-entry" data-sheet="log">[ + New entry ]</button>
  </section>

  <section class="screen" id="s-forecast" hidden>
    <div class="o-top">
      <span class="o-eb">Coming months</span>
      <button class="o-key" data-sheet="adjust">Adjust</button>
    </div>
    <div id="f-hero"></div>
    <div id="f-chart"></div>
    <div id="f-grid"></div>
  </section>

  <section class="screen" id="s-month" hidden>
    <div class="o-top">
      <button class="o-key" data-go="today">‹ Today</button>
      <span class="o-eb">Every month</span>
    </div>
    <div id="m-hero"></div>
    <div id="m-rows"></div>
    <div id="m-foot"></div>
  </section>

  <section class="screen" id="s-spends" hidden>
    <div class="o-top">
      <button class="o-key" data-go="today">‹ Today</button>
      <button class="o-key" id="sp-entry" data-sheet="log">+ Entry</button>
    </div>
    <div id="sp-hero"></div>
    <div id="sp-rows"></div>
  </section>

  <section class="screen" id="s-subs" hidden>
    <div class="o-top">
      <button class="o-key" data-back="subs">‹ Back</button>
      <span class="o-eb" id="su-count"></span>
    </div>
    <div id="su-hero"></div>
    <div id="su-rows"></div>
    <div id="su-gone"></div>
  </section>

  <section class="screen" id="s-debts" hidden>
    <div class="o-top">
      <button class="o-key" data-go="today">‹ Today</button>
      <span class="o-eb">US + NL</span>
    </div>
    <div id="d-hero"></div>
    <div id="d-cards"></div>
    <div id="d-dutch"></div>
    <div id="d-leave"></div>
    <div id="d-note"></div>
  </section>

  <section class="screen" id="s-bank" hidden>
    <div class="o-top">
      <button class="o-key" data-go="today">‹ Today</button>
      <span id="b-sync"></span>
    </div>
    <div id="b-body"></div>
  </section>

  <section class="screen" id="s-payments" hidden>
    <div class="mast">
      <button class="back" data-go="today">‹ Today</button>
      <span class="eyebrow" id="p-count"></span>
    </div>
    <div class="card bare" id="p-head"></div>
    <div id="p-rows"></div>
  </section>

  <section class="screen" id="s-tasks" hidden>
    <div class="o-top">
      <span class="o-eb" id="k-count"></span>
